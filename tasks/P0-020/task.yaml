schema_version: '1.0'
id: P0-020
title: 역할별 실행·Supervisor 수집·팀 예산·취소
objective: 팀 이름만 생성하는 데 그치지 않고 역할이 근거/실험/분석을 수행하고 안전하게 종료한다.
kind: task
source_tasks:
- P0-020
requirement_refs:
- docs/PRODUCT_REQUIREMENTS.md
- docs/archive/TASKS_2026-09-26.md
- docs/EVALUATION_CONTEXT.md
priority: P0
status: verifying
spec_state: ready
unresolved: []
workstream: agents
execution_role: coordinator
estimated_effort: 3.0
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: 조사 시 canonical은 단일 domain_task 실행과 owner-bound Run/관측만 구현되어 있고 팀 역할 실행은 missing/not_run이다.
  LocalRuntime.status는 in-memory _results.get(run_id)이고 cancel 본문은 not_implemented를 발생시킨다. P0-019 prepare/cleanup
  구현은 별도 선행 산출물이며 역할 실행 증거가 아니다. 후속 구현의 권한·저장·예산·취소 제어는 local, 모델·실험·read tool 공급자는 mock/simulated이다.
  GPU·키·외부 서비스 없이 검증하며 실제 NVIDIA/Skill/OpenShell 또는 실측 실험 성공으로 표시하지 않는다.
scope:
  included:
  - 기존 역할별 typed 입력·결과, ToolPort read 실행 연결, Supervisor 위임·수집, shared team budget과 LocalRuntime cancel/status를
    구현한다. 최소 구현은 순차 실행·concurrency=1이며 병렬화는 AC가 아니다. Benchmark의 supervisor/paper_scout/experiment_runner/result_analyst와
    Research의 supervisor/source_scout/evidence_reviewer가 각각 실제 handler를 실행하고 Supervisor만 결과를 수집한다.
  - P0-019 TeamFactory.ensure와 승인 TeamSpec/별도 execution_budget/definition_digest를 재사용한다. WorkService.run은
    현재 graph 전에 create_owned_run을 호출하고 _execute_inner의 frozen1.0 projection은 DirectWorkRequest.task_id를
    제거한다는 조사 사실 때문에 service와 repository 경계가 필요하다. Run 생성은 유지하고 Supervisor의 명시적 팀 실행 분기에서 선택/재사용한 ready
    팀을 첫 역할 실행 전에 owner/domain 확인된 Run에 원자적으로 한 번 결합한다. 신규 Task 생성 key는 서버 Run 기준으로 안정화하며 client/team/actor
    ID 문자열이나 저장된 과거 principal을 현재 권한으로 사용하지 않는다.
  - 기존 RepositoryPort와 SQLite migration 체계에 Run↔Task↔Team 결합과 역할 실행 기록의 최소 메서드를 추가한다. 저장된 product_task_owners/TeamLifecycle가
    소유권 원본이며 session_tasks의 N:M 연결도 같은 짧은 transaction에서 갱신한다. 동일 결합은 멱등 허용, 다른 task/team/domain 재결합·타인
    Task·비 ready 팀은 거절한다. runtime IO를 transaction 안에서 수행하지 않는다. binding/역할 receipt의 generation·완료 조건을
    검사하고 미완료/unknown 부작용은 재시작만으로 성공 또는 재실행 허가로 바꾸지 않는다.
  - RuntimePort/ToolPort와 기존 contracts/models.py를 유일한 계약 원본으로 유지한다. 역할 입력/결과·부분 결과·사용량·부모 Run/역할 실행 key의
    typed envelope는 기존 1.1 계약에 추가/확장하고 1.0 AgentSpec/TaskRequest/TaskResult/ToolRequest/RunResult wire
    schema는 변경하지 않는다. envelope가 legacy payload/output에 들어갈 때도 경계에서 재검증하며 capability·identity·source scope의
    원본은 현재 인증 context와 저장된 승인 TeamSpec이다. 별도 DTO 파일/port 프레임워크/상태 원본을 만들지 않는다.
  - 역할별 tool allowlist·capability·허용 source·domain/task/team/agent memory namespace를 실제 호출 전에 강제한다. TeamFactory의
    빈 source/tool scope는 권한 없음이며 P1-001A의 현재 ACL 조회와 신뢰된 역할 정책의 교집합만 부여한다. 다른 역할/Task memory 접근과 worker
    직접 메시지는 거절한다. 별도 memory engine 없이 고정 namespace와 제한된 실행 context를 사용하며 문자열을 붙였다는 이유만으로 OS 격리 또는 영속 memory
    기능을 주장하지 않는다.
  - P1-001A 최신 자료/ACL 경계를 소비하고 기존 LocalPolicy/mock 안에서만 역할을 실행한다. 미구현 endpoint-egress 증명이 필요한 실제 Model/Tool/Response
    외부 호출은 실행 전에 fail closed한다. P1-005가 후속 egress 확장·조립을 맡으므로 역방향 의존성을 추가하지 않는다. 일반 저장/검색 요청에는 팀을 만들지
    않으며 명시적 팀 실행 입력 경계와 P1-004 후속 intent router 책임을 구분한다. 기존 단일 domain 경로와 review/승인 재개는 호환 유지하고 범용 router를
    중복 구현하지 않는다.
  - P1-006D Observations와 기존 trace 저장/alias를 확장한다. 현재 observation_context는 team_id를 읽지 않고 ObservedPort.run은
    domain-supervisor 이외 actor를 assistant-supervisor로 축소하므로 저장된 팀 멤버 검증을 통과한 actor만 안전한 alias로 매핑한다. Run/Task/Team/domain
    결합은 DB 원본에서 읽고 초기 request 단계에 아직 없는 task/team은 null을 유지한다. 뒤의 결합 때문에 이미 저장된 관측을 재작성하지 않는다. 역할별 순서·지연·실패·실제
    tool read는 관측하고 실제 없는 policy decision/approval/sandbox ID는 만들지 않는다.
  - ObservedPort에 ToolPort.execute 관측 메서드를 추가하고(main 2c880f2까지 execute가 없고 MockTool은 Container에만 노출되어
    graph/handler에 미연결) bootstrap에서 ToolPort를 이 decorator로 감싸 역할 handler에만 주입하고 ledger의 tool collected/incomplete/calls를
    실제 port receipt 기준으로 계산한다. 시작 intent만 남으면 calls=null이며 test_sink receipt와 구분한다. source/policy 참조는
    신뢰된 현재 저장 상태에 결합하고 token 미제공은 null이다. raw prompt/문서/도구 인자/사용자 지정 ID/secret은 trace에 남기지 않는다. native
    trace guard·alias 재시작 안정성·JSONL at-least-once export 의미·file TTL/DB ledger 보존 경계는 유지한다.
  - 팀 전체의 step/tool/time/concurrency 예산을 역할 사이 공유하고 다음 작업 직전에 남은 예산·취소 상태를 검사한다. 역할마다 전체 예산을 새로 지급하지 않는다.
    토큰 상한이 필요한 호출은 provider의 강제 가능한 상한과 신뢰할 수 있는 사용량 계약이 없으면 시작/후속 호출 전에 budget_unavailable로 안전 중단한다.
    usage unknown을 0으로 차감하거나 임의 추정값을 실측으로 기록하지 않는다. 결정적 fake provider의 bounded usage fixture는 simulated로
    구분하여 정상 예산 경로를 검증한다. 필수 worker 실패/timeout/예산 부족 시 이미 수집한 안전한 부분 결과와 고정 사유를 보존하고 review를 시작하지 않는다.
  - LocalRuntime의 in-flight 역할 실행 key와 부모 제품 Run을 구분하여 같은 run_id의 여러 역할이 status를 덮어쓰지 않게 한다. owner-authorized
    서비스 취소 경계가 현재 역할을 중단하고 다음 역할/tool 호출을 차단한다. 부모 Run 취소와 1.1 역할 취소 receipt 의미를 분리하고 기존 1.0 ResultStatus를
    임의 변경하지 않는다. RuntimePort cancel은 외부 인증 원본이 아니며 API/서비스의 인증을 대신하지 않는다. 취소/unknown 뒤 늦은 결과가 terminal
    상태를 덮어쓰지 못하고 이미 발생한 효과를 되돌렸다고 주장하지 않는다. 새 HTTP 취소 endpoint/UI는 이 task의 완료 조건이 아니며 서비스-level 경로와 실제
    spy로 검증한다.
  - P0-019는 main b5c825e에 통합되었고 tests/test_teams.py와 application/teams.py는 기존 선행 소스다. 해당 Factory/lifecycle을
    재작성하지 않는다. 시작 시 KB/권한 선행 산출물과 최종 계약 digest를 다시 확인하고 공통 소유 파일은 coordinator 한 명이 직렬 수정한다.
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
  - 실제 승인/게시 원본·OpenShell sandbox·새 runtime/backend/framework·worker 직접 통신·Debate 구현
