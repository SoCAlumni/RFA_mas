schema_version: '1.0'
id: P1-002
title: NVIDIA ModelPort adapter 준비
objective: mock 생성을 NVIDIA 호출로 교체할 좁은 경계를 준비한다.
kind: task
source_tasks:
- P1-002
requirement_refs:
- docs/PRODUCT_REQUIREMENTS.md
- docs/archive/TASKS_2026-09-26.md
priority: P1
status: todo
spec_state: ready
unresolved: []
workstream: integration/evaluation
execution_role: coordinator
estimated_effort: 1.5
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: 기존 NVIDIA provider는 reserved이며 adapter missing/not_run. 이 task는 httpx MockTransport를 사용하는
  local/simulated 계약 구현; 실제 NVIDIA 호출 성공과 한국어 품질 증거는 P1-002A. 현재 연구는 공식 hosted API 문서와 local NIM 예제 확인이며
  real provider 검증이 아니다.
scope:
  included:
  - ModelPort adapter·구조화 응답 validator·tool request 제한. 기존 Lightning main/Ultra Judge 후보를 공식 model card/API
    reference와 대조하고 지원 기능/한국어 rubric을 기록; 검증 안 된 기능은 enabled로 광고하지 않음.
  - 기존 httpx로 async NVIDIA chat/completions adapter와 좁은 DTO mapper를 구현한다. ModelPort.generate→ModelResult
    경계를 유지하고 URL/auth/provider SDK를 graph에 넣지 않는다. 기존 loopback 전용 ReferenceHttpClient의 제한을 NVIDIA 연결을
    위해 완화하지 않는다.
  - 현재 ModelRequest에는 tool schema/호출 실행 계약이 없다. 이 adapter는 텍스트 또는 검증된 JSON object에서 content를 매핑하는 1회 생성
    경계이며 tool loop/MCP 실행을 하지 않는다. 선택하지 않은 tool_calls, 비어 있는 content, 잘못된 schema 및 잘린 finish_reason=length를
    성공으로 처리하지 않는다. P1-002A의 tool_choice probe도 호출 제안 생성 검증이지 도구 실행 증거가 아니다.
  - hosted endpoint/model ID와 local NIM/vLLM 설정 근거를 구분해 기록한다. stream=false를 명시하고 reasoning을 사용자 content/trace에
    복사하지 않는다. JSON object 요청을 사용한다면 내부 Pydantic 응답 검증과 content 매핑을 적용하며, json_schema/strict 서버 지원은 확인
    없이 활성화하지 않는다. chat_template_kwargs는 HTTP JSON 최상위 필드이며 SDK extra_body를 wire 필드로 복사하지 않는다.
  - P1-005의 신뢰된 정책 경계에서 query·근거·첨부·현재 source/policy·정확한 추론 endpoint를 허가한 요청만 전송한다. 키 존재, ALLOW_EXTERNAL_EGRESS,
    trace ID, caller/모델 작성 allow는 권한 증명이 아니다. 기존 NVIDIA_BASE_URL/NVIDIA_MODEL/NVIDIA_API_KEY, HTTP_TIMEOUT_SECONDS/MAX_READ_RETRIES를
    재사용하고 새 동의어 환경변수를 만들지 않는다.
  - 인증 헤더를 갖는 httpx 요청은 허가된 HTTPS endpoint에만 전송하고 자동 redirect 및 ambient proxy를 사용하지 않는다(follow_redirects=false,
    trust_env=false). 응답 크기를 제한하고 timeout/429/5xx/잘못된 JSON/schema/401·403/202 pending을 비밀 없는 도메인 오류로 매핑한다.
    202를 완료 또는 도구 write 실패로 추정하지 않는다; 확인된 polling 계약이 없으면 명시적 미완료로 반환한다.
  - coordinator가 확정한 남은 예산 안에서만 429/일시적 5xx의 bounded Retry-After를 처리한다. 자동 호출은 최초 포함 최대 3회와 기존 설정 상한 중
    작은 값이며 총 deadline을 넘지 않는다. timeout 후 반복 비용도 예산에 포함하고 auth/schema/validation 오류는 자동 반복하지 않는다. 취소를 전파하고
    provider 오류·설정 누락을 mock fallback으로 바꾸지 않는다.
  - bootstrap에 adapter 생성/종료를 배선하고 ObservedPort의 현재 model mode=mock 하드코딩을 실제 선택 provider/transport 증거
    경계에 맞춘다. MockTransport 통과를 real 네트워크 증거로 표시하지 않는다. ModelResult의 실제 provider 결과와 mock retrieval을 포함한
    전체 제품의 simulated 상태를 구분하며 raw prompt/본문/인자/reasoning/응답/secret을 관측 ledger에 저장하지 않는다.
  - 기본 mock 부팅은 키 없이 유지한다. 선택된 nvidia 설정 누락은 정확한 configuration error로 처리하고 doctor에는 configured/missing·준비
    상태만 남긴다. 기능 활성화와 정책 허가는 분리한다. docs/evidence/nvidia-model.md에는 capability 근거와 not_run만 먼저 작성하고, P1-002A가
    같은 파일에 별도 실제 호출 증거를 순차 추가한다.
  - '2026-09-27 coordinator 결정(egress): 새 DTO 없이 신뢰 경계 두 겹으로 확정한다. (1) P1-005 domain graph screen이 model_endpoint=cloud일
    때 공개 근거만 남기고 비공개 표식 질의를 모델 호출 전에 거절한다. (2) NVIDIA adapter decorator가 정확한 endpoint·model만 허용하고 모든 근거가
    public이며 표식이 없을 때만 전송한다. caller/LLM의 allow 필드는 쓰지 않는다.'
  - '2026-09-27 coordinator 결정(budget): 호출당 deadline(HTTP timeout), 최초 포함 최대 3회와 MAX_READ_RETRIES 중 작은
    값의 bounded 재시도, NVIDIA_MAX_OUTPUT_TOKENS 상한, 그래프 step/tool 예산을 적용한다. 팀 전체 token 예산 전파는 계약 변경이 필요한
    후속(P1-006A/P2)으로 남기고 전체 token 예산 준수는 주장하지 않는다.'
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
  - 신규 NVIDIA SDK/framework·로컬 GPU NIM 설치·MCP/tool 실행 loop·graph 재작성·Judge 구현. Judge 호출은 기존 별도 평가 task의
    책임이다.
  - P1-002A 소유 tests/integration/test_nvidia_live.py 구현/실행·실제 credential 사용·실측 품질 주장. timeout만으로 tool_choice
    미지원이라고 결론내리지 않는다.
