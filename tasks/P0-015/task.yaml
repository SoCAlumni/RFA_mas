scope:
  included:
  - versioned SQLite migration으로 sessions/messages/run owner/session-task 연결 저장. 세션 목록·상세·이어하기와 실행 상태/결과
    조회 API(예정). 고정 api-client/fixture 권한 대신 인증된 로컬 소유자와 서버 보유 membership 매핑을 사용하며 다사용자 로그인 제품은 추가하지 않는다.
    WorkRepositoryPort 재사용; 필요한 경우에만 별도 repository 경계 분리.
  - P0-014 1.1 SessionRecord/DirectWorkRequest 의미를 수락. 기존 /v1/work HTTP wire와 DB 자료를 보존하고 owner 접근 검사
    회귀는 tests/test_api.py에서 함께 검증. 새 공유 DTO/계약 export 변경이 필요하면 coordinator에게 이유·호환성·영향을 먼저 보고한다.
  - Coordinator가 SessionMessage/SessionDetail/RunRecord 최소 1.1 확장과 새 세션 API/port를 승인. 기존 1.0 wire surface를
    projection으로 검증하고 현재 확장 schema를 생성한다. 원본 baseline.json은 보존, 실제 계약 변경 digest는 검증/통합 시 publish-contract한다.
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
