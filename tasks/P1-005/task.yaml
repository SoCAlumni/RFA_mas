acceptance_criteria:
- id: AC1
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: owner/BU/company/public + 프로젝트 membership + 개인 선호 적용, 읽기 가능≠공유 가능
  required: true
- id: AC2
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 공유 허가된 근거로 먼저 초안 생성; private 초안을 마지막 문자열 삭제만으로 공개화하지 않음; loader의 선택 source·L0/L1/L2·실측 크기·insufficient를
    실제 Model 입력 spy에서 확인
  required: true
- id: AC3
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: cloud Model/Tool 호출 전 전송 허가, 모의 악성 문서 지시는 정책/tool 권한을 바꾸지 못함 Response/embedding/reranker/Judge/trace
    수신처에도 같은 endpoint-egress 원칙. private 본문뿐 아니라 제목/요약/관계·인자/첨부를 선차단
  required: true
- id: AC4
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 개인 1:1·내부 GPU canary가 외부 DTO/오류/알림/trace에 없음. source/정책 갱신 시 이전 context를 재판정; 모델이 만든 allow·tool의
    승인 위장으로 우회 불가
  required: true
