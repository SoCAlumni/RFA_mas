acceptance_criteria:
- id: AC1
  given: 대표 질의, 허용/무관/비공개 source, read spy
  expect: 기본 전체 KB 원문 주입 없음; 허용 L0→유효 L1(없으면 명시)→선택 L2 구간만 읽고 source/stage/실측 byte 또는 character 수 기록
  required: true
- id: AC2
  given: 역할·목표·membership·share/endpoint-egress 제한과 작은 context 예산
  expect: 모델/embedding/reranker 전송 전 허가. 필수 지침·현재 목표·권한 규칙은 보존하고 선택 자료만 축소; 부족하면 insufficient, 토큰 절감률
    약속 없음
  required: true
- id: AC3
  given: source revision/삭제/ACL/share/정책 변경과 다중 부모 요약/cache
  expect: 필요한 모든 부모의 최신 정책·revision을 재확인하여 stale/restricted 재사용 거절. private 제목/요약/관계가 public context로
    재유입되지 않음
  required: true
- id: AC4
  given: 기존 요약이 없는 KB와 local/native 소비자
  expect: 자료 3배 복제·자동 요약 엔진 없이 최소 조회 구현. 생성 요약은 검토/provenance 경계로 분리. P1-005가 조립할 동일 port/DTO 출력 제공, 개발
    context-pack와 별개
  required: true
