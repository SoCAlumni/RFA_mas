- id: AC1
  given: 대표 질의, 허용/무관/비공개 source, read spy
  expect: 기본 전체 KB 원문 주입 없음; 허용 L0→유효 L1(없으면 명시)→선택 L2 구간만 읽고 source/stage/실측 byte 또는 character 수 기록
