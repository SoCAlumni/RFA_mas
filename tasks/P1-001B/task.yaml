- id: AC2
  given: 역할·목표·membership·share/endpoint-egress 제한과 작은 context 예산
  expect: 모델/embedding/reranker 전송 전 허가. 필수 지침·현재 목표·권한 규칙은 보존하고 선택 자료만 축소; 부족하면 insufficient, 토큰 절감률
