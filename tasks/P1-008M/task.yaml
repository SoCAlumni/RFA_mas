id: P1-008M
title: NemoClaw 운영 채널 — PoC 코어를 sandbox agent에 노출하고 OpenClaw 비서 skill로 실행
objective: 사용자 PoC 코어(실제 모델·같은 KB/Task 팀)를 인증된 LAN 게이트웨이로 NemoClaw sandbox에 노출하고, OpenShell 정책으로 허용 route만
  열어 sandbox 안 OpenClaw agent가 RFA 비서(/v1/assistant)를 통해 응답하게 한다. 선택을 LLM이 후보 안에서 추론하며 그 과정을 상태 카드에 보인다.
  동의 없으면 기존 mock/로컬 경로를 유지한다. 카드에 목록으로 보여준다.
