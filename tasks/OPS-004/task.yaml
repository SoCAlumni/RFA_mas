  expect: 동일 (worktree, argv)의 읽기 전용 git 조회는 호출당 1회만 실행되고 결과(성공/거절)가 같게 재사용된다. 호출이 끝나면 memo가 비워져 다음 호출은
    새 상태를 읽는다.
  required: true
- id: AC2
  given: in-process execute() 직접 호출 또는 memo 밖 git 조회
  expect: memo가 비활성이라 매번 새 git 상태를 읽는다. 호출 사이 source 변경(tampered head, dirty tree)은 기존대로 stale/거절된다.
  required: true
- id: AC3
  given: 기존 taskctl/이관 회귀
  expect: claim·fencing·evidence 불변성·scope·계약 수락 규칙을 약화하지 않고 기존 테스트가 통과한다.
