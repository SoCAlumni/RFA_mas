acceptance_criteria:
- id: AC1
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: approved/rejected/revision_requested/timeout/outcome_unknown을 mock와 reference HTTP가 같은 의미로 재현;
    정상/정책 deny/승인 없음/본문 변경/source ACL 회수/중복/timeout 7종을 같은 consumer로 실행하고 unsupported contract version
    명시 오류
  required: true
- id: AC2
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 미인증 callback·승인자/대상/version/hash 불일치·이벤트 replay 거절/멱등 처리; 정책/identity/승인 proof 누락·위조·expired이면
    보호 동작 0회. 승인 뒤 본문/첨부/대상/policy/source ACL이 바뀌면 재검토
  required: true
- id: AC3
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 게시 timeout은 실패·재게시로 단정하지 않고 원본 status/receipt 대사, run 상태와 분리; 원본 결과 참조로 조회/복구할 때까지 unknown,
    자동 재게시 0회
  required: true
- id: AC4
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: mock/reference 동일 suite 통과, graph에 URL/auth/MCP SDK 없음; P0 network write 선차단 유지.; mock transport
    성공은 real OpenShell/MCP/게시 증거가 아니며 model/retrieval/response egress 결정 참조 유지
  required: true
