acceptance_criteria:
- id: AC1
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 완료 effect는 동일 key 결과 재사용, 다른 payload 거절, team/draft 중복 없음
  required: true
- id: AC2
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 승인 대기·중단 상태는 재조회/허가 후 resume; failed/cancelled terminal은 보존하고 명시적 재시도만 새 run으로 연결
  required: true
- id: AC3
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: intent 저장 직후/호출 후 결과 저장 전 crash는 outcome_unknown으로 조회·대사하고 자동 재게시 안 함
  required: true
- id: AC4
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: checkpoint와 DB 사이 원자성을 가정하지 않고 ledger로 복구; 취소·권한 회수 후 후속 호출 금지.
  required: true
