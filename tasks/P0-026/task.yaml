  인수 검증 전이며 real-model/UI/standalone sandbox 증거는 별도 판정.
scope:
  included:
  - 실험 메모·issue export·내부 잠정 계획·공개 FAQ·개인 1:1·개인 GPU 메모의 합성 fixture, demo 옵션/명령, OpenAPI·설정 이름·오류/cancel/timeout
    payload·버전 변경 이력·통합 smoke 절차. NVIDIA/Skill resource/readiness 준비 항목 포함, 실제 실행 주장은 별도.
  - 합성 입력→권한 context 선택→팀 선택/재사용→역할 근거→공격/비공개 처리→public DRAFT→정확한 승인→게시 결과의 safe UI용 report. 기존 복구/예약/canary
    gate 유지; NAT 없는 local 완주와 installed NAT/real peer는 별도 집계.
  - E2E-01/02/03/04/06/07/08/09의 controlled API 통합과 E2E-10 실제 앱 subprocess 중단/재시작·100요청 부하를 기존 final_acceptance에서
    검증한다. E2E-05 실제 OpenShell gate는 P1-007B, UI/real-peer는 P1-008A/B로 연결하고 mock 결과로 대체하지 않는다.
  - R01~R10·R01-v2·R05-closed·R06-attack·M01, persona 4종, 20/1000문서 고정 seed·clock, golden 질문 20개와 허용 source
    분모를 fixtures/e2e에 고정한다. 최소 3회 controlled 핵심 사례 반복; 도구/게시 sink와 실제 API 경로 사용. 테스트 파일·명령은 구현 전 planned.
  - '초기 성능 기준을 실행 전에 acceptance_config.json에 고정: ACK/진행 2s, 검색 반영 30s, 1000문서 검색 5s, 실제 모델 응답 30s, 소형
    팀 180s, schedule tick 지연 5s, restart health 후 조회 10s, 지원 tool cancel 5s, worker 상한 2. 소표본 median/max/n,
    별도 정상부하 n=100 p50/p95. 실패 후 기준 하향 금지; 실제 provider 지연 포함.'
  - 원문에 있는 선택 Debate/auto Task/rebuild만 미구현 시 variant not_run 허용. 기억 M01·권한·중복·취소·복구 등 필수 기능을 선택으로 바꾸지
    않는다. real model/embedding/reranker/Judge 및 실제 runtime 검증은 별도 gate와 실제 버전/실행 증거로 판정한다.
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
  - 최종 README/교육/통합 증거 편집은 기존 P1-009 단일 소유. P0-026은 실행 가능한 DEMO와 harness/report를 제공하며 제품 소스 전체를 검증 fingerprint에
    포함한다.
