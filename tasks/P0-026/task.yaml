acceptance_criteria:
- id: AC1
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: '합성 저장→권한/context 선택→Benchmark/Research 팀 선택·재사용→역할 근거·후보→공개 DRAFT→정확한 mock 승인/게시 결과를 키/GPU/Docker/NAT
    없이 완주; 실험 measured/mock/not_run 표시. E2E-01/02/03: 20개 ingest 부분 실패·upsert·출처, 10.0→8.2ms 지연 18% 감소/정확도
    0.2%p 하락 assertion, checksum 미확인·6ms 가설 구분, golden20 Recall@5와 핵심 사실 정확도 목표90%/인용 precision, 팀 중복0·재사용·CPU
    계산/미실측 구분.'
  required: true
- id: AC2
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: '새 프로세스 승인 대기·일정 복구, 동일 이벤트 team/tool/draft 중복 없음 E2E-04/10: fixed-clock tick/replay·coalescing과
    완료 issue 제외/설명 가능한 순위, 체크포인트 도달+진행 중 tool 확인 후 실제 subprocess kill/restart, 4세션/2팀/전체 worker≤2, 승인·팀·일정
    보존, 실제 worker 취소·자원 회수 및 다른 세션 응답 확인.'
  required: true
- id: AC3
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 'DRAFT 수정/권한 회수 후 이전 승인 무효, 공개 DTO/알림/trace canary 없음; 동일 입력세트의 정상/공격 경계를 실제 replay하고 주입 도달/성공·차단·unknown·승인
    위반·outbound/write를 분리, 차단 후 공개 근거로 작업 계속 E2E-06/07/08/09: persona별 read/share/egress+cache/metadata
    제한, 공격4종 도달/실제 sink+write/정상 보안설명 대조, 인증 callback·본문/대상/첨부/정책 변경·ACK유실 조회·중복/역순 callback, R01-v2 최신날짜/권한철회
    즉시 차단/요약·cache무효화, M01새세션 반영과 보안정책 불변.'
  required: true
- id: AC4
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 제공 명령을 임시 데이터 경로에서 실행 후에만 README에 사용 가능 표시, 증거에 local/mock/real/not_run 기록. Run에 source/policy/approval/receipt가
    연결된 화면용 DTO/report를 제공(UI 구현 제외). 실제 latency·token 수집 범위/null, code/contract/model/prompt/template/fixture/policy
    versions 보존. P0-028 installed NAT, NVIDIA/Skill/NemoClaw/OpenShell/팀원 gate 미실행이면 전체 완료 아님 원문 E2E-01~10
    scenario/variant별 기능·보안·품질·성능·실제연동 상태 및 증거 표 필수. API만 있으면 UI E2E not_run. 임계값/장비/버전은 실행 전 고정; controlled
    core≥3회, real 대표≥3회, load n=100, 지연·CPU/RSS·context 문자/실측 token/null·queue 기록. 성능 미달/미실행을 기능 테스트 pass와
    혼합하지 않는다.
  required: true
