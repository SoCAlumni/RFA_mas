title: 실제 LLM 응답·추론 — NVIDIA 모델 소유자 동의 egress·LLM 라우팅·팀 요약
objective: 소유자가 명시 동의(ALLOW_EXTERNAL_EGRESS)하면 설정된 NVIDIA 모델 endpoint로 비공개 근거를 보내 실제 LLM이 답변·요약하고, 의도·담당
  선택을 LLM이 후보 안에서 추론하며 그 과정을 상태 카드에 보인다. 동의 없으면 기존 mock/로컬 경로를 유지한다. 카드에 목록으로 보여준다.
