acceptance_criteria:
- id: AC1
  given: MODEL_PROVIDER=nvidia와 ALLOW_EXTERNAL_EGRESS=true/false
  expect: true면 소유자 대상 요청에 비공개 근거가 설정 endpoint로만 전송되고 공개 대상은 여전히 public 근거만; false면 비공개 근거 전송 0(기존 동작);
    mock provider에서는 여전히 reserved
  required: true
- id: AC2
  given: 채팅 질의/메모/조사 요청(가짜 NVIDIA transport)
  expect: reasoning 단계에 LLM 의도·담당 선택(후보 밖 ID는 무시→비서)·사유가 기록되고, 비서 fallback은 근거 발췌로 LLM 답변을 합성해 보존하며 source
    변경/권한 회수 시 재표시하지 않는다
  required: true
- id: AC3
  given: 실제 NVIDIA endpoint(.env.dev)와 --model nvidia
  expect: 합성 KB 질의에 실제 모델 답변이 오고 응답에 adapter=nvidia-chat-completions·simulated=false; 키/원문이 로그·trace·evidence에
    없다
  required: true
