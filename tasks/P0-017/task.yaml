acceptance_criteria:
- id: AC1
  given: 현재 구현된 설정과 아직 구현하지 않은 후속 기능을 구분한 합성 설정 입력
  expect: 현재 소비되는 typed settings와 env example은 이름이 1대1로 대응한다. session/checkpoint는 실제 경로를 재사용하고 scheduler/jobstore/timezone/misfire,
    팀 token/time/tool/concurrency, trace 보존, Judge endpoint와 embedding/reranker/trace egress의 미구현 설정은
    소유 task·명칭·미적용 이유를 가진 단일 planned catalog로 정의한다. 실제 읽지 않는 예정 설정은 활성 env assignment로 광고하지 않으며 NAT·예약·외부
    전송 진입 gate는 선택 시 명시적으로 미지원임을 반환한다. eval opt-in은 기존 ENABLE_JUDGE/평가 진입점을 재사용한다.
  required: true
- id: AC2
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 모든 key/token 예시 값은 빈칸, 실제 env 덮어쓰기 없음
  required: true
- id: AC3
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: doctor는 변수명·configured/missing만, local ready와 selected real readiness 구분; NAT extra missing/disabled와
    실제 provider readiness를 구분하며 설치/키 존재로 egress를 허용하지 않음
  required: true
- id: AC4
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 외부 write 기본 false, flag는 권한 아님, real 누락/미지원 명확한 오류. 외부 egress도 기본 비활성; NAT 선택+의존성 누락은 명시 오류,
    core 기본 mock은 extra/키 없이 부팅
  required: true
- id: AC5
  given: 합성 SQLite 버전(수정 전 및 공식 수정 계열)과 현재 실제 내장 런타임
  expect: WAL 패치 상태/실측 버전을 configuration readiness·live provider 검사와 분리해 표시하고 지원되지 않는 버전은 명시 경고한다. doctor가
    환경을 변경하거나 미실행 무결성 검사/전체 E2E를 통과로 표시하지 않는다.
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC4
  - AC5
  type: command
  availability: planned
  prerequisites:
  - 현재 설정 이름 parity와 planned catalog의 단일 소유·미지원 표시, reserved/누락·secret masking 검사를 tests/test_settings.py에
    확장한다.
  - 합성 기본값을 명시하고 _env_file=None을 사용한다. 실제 환경 파일·credential·네트워크는 읽지 않는다. live 연결은 not_run이다.
  cwd: .
  argv:
