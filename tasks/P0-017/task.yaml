  - pytest
  - -q
  - tests/test_settings.py
  timeout_seconds: 120
  procedure: []
  assertions:
  - 현재 typed settings/example의 1대1 이름과 planned catalog 단일 소유·미적용 상태를 확인한다.
  - key/token 예제 값은 모두 빈칸이며 실제 env를 수정하지 않는다.
  - doctor/bootstrap 공통 판정은 configuration/implementation과 local lifecycle/provider probe not_run을 구분하며
    값과 credential을 출력하지 않는다.
  - 기본 mock 부팅·외부 write/egress 비활성, 선택한 미지원 real/NAT/scheduler는 명시 오류이며 fallback이 없다.
  - 실측 SQLite 버전과 합성 patched/unpatched 경계가 올바르게 보고되며 자동 환경 교체/미실행 검사 성공 주장이 없다.
