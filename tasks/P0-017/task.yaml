scope:
  included:
  - 아래 설정 후속 표를 typed settings와 예제에 반영. DATABASE_URL·backend·예산 이름 재사용; 신규 이름은 중복 없이 확정. 미구현 backend는
    reserved.
  - NAT/evaluation 선택·로컬 trace/evidence·Judge endpoint·egress 정책 누락만 planned로 보충. 기존 ENABLE_JUDGE/JUDGE_*/TRACE_DIR/TRACE_BACKEND/LANGFUSE_*
    등 재사용; 실제 읽지 않는 설정을 지원 목록에 추가하지 않음. NAT dependency pin은 P0-027 coordinator 소유와 순차 통합.
  - doctor와 bootstrap이 동일한 부작용 없는 configuration/implementation 검사를 사용한다. configured, implemented, local
    lifecycle readiness, live probe not_run을 분리하며 PostgreSQL URL·미지원 non-loopback HTTP를 ready라고 표시하지 않는다.
  - P0-016 CHECKPOINT_PATH와 기존 ENABLE_JUDGE/JUDGE_*/TRACE_*를 재사용한다. 미구현 scheduler/NAT/retention은 reserved/planned로
    명시하며 dependency 설치/키 보유를 실제 기능·egress 권한 증거로 취급하지 않는다. dev_env 생성 credential은 실제 서비스 등록이 아님을 표시하고
    기존 실제 프로필을 수정하지 않는다.
  - 실측 SQLite 런타임의 WAL-reset 패치 상태를 부작용 없는 doctor 진단에 분리 표시한다. Python 패치 번호만으로 내장 SQLite를 추정하지 않는다. 같은
    CPython3.12.13의 공식 PBS20260807/SQLite3.53.1 격리 qualification 기록을 참조하며 앱이 interpreter를 자동 교체하지 않는다.
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
