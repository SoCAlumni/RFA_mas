acceptance_criteria:
- id: AC1
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: job ID는 owner/schedule에 안정적이고 의도한 upsert만 replace_existing 적용, 소유 lock으로 두 번째 runner 시작 거절
  required: true
- id: AC2
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: FastAPI lifecycle/worker에는 scheduler를 시작하지 않고 재기동 시 persisted next_run을 초기화하지 않음
  required: true
- id: AC3
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 3.x add_job/CronTrigger API만 사용, max_instances=1·coalesce·misfire 설정과 ledger 실행 key 연계
  required: true
- id: AC4
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: jobstore에는 고정 top-level dispatcher와 안전한 schedule ID만 직렬화, credential/본문/callable 입력 없음.
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC4
  type: command
  availability: planned
  prerequisites:
  - 실제 jobstore close/reopen, 반복 초기화의 job 수 불변, 두 runner 경쟁, trigger의 명시 now 기준 다음 시각. fake clock으로 dispatch
    검증하며 긴 sleep 없음. SQLAlchemy/jobstore는 이 프로세스만 소유.
  - 작업 control 상태가 아닌 source worktree에서 실행. 실제 .env 읽기 금지; test fixture/명시 설정만. live 검증은 opt-in이며 skip은
    성공 아님.
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/test_schedules.py
  timeout_seconds: 120
  procedure: []
  assertions:
  - job ID는 owner/schedule에 안정적이고 의도한 upsert만 replace_existing 적용, 소유 lock으로 두 번째 runner 시작 거절
  - FastAPI lifecycle/worker에는 scheduler를 시작하지 않고 재기동 시 persisted next_run을 초기화하지 않음
  - 3.x add_job/CronTrigger API만 사용, max_instances=1·coalesce·misfire 설정과 ledger 실행 key 연계
  - jobstore에는 고정 top-level dispatcher와 안전한 schedule ID만 직렬화, credential/본문/callable 입력 없음.
  runner: pytest
