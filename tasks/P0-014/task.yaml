acceptance_criteria:
- id: AC1
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: 위 식별자 관계와 상태 원본, 읽기/공유/전송 권한 명시; session/task/team/run/agent/trace와 source revision/location·policy
    decision·draft/approval/receipt를 join하며 발생 전 단계는 null. trace ID/모델 allow는 인증·정책 증명이 아님
  required: true
- id: AC2
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: direct user와 internal/public channel 진입 DTO 구분, 외부 요청은 Supervisor에만 도달; context stage와 역할/목표/endpoint
    read/share/egress 판단 및 다중 부모 제한을 전달; 선택 읽기와 권한 선필터 인터페이스를 동결
  required: true
- id: AC3
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: Runtime의 run/status/cancel 유지, prepare/cleanup 보충 계약과 TeamSpec→AgentSpec binding 정의; 승인/게시 원본
    승희·runtime 원본 다영·Policy 소유 미확정. 본문/첨부 hash·대상·정책·source ACL 변경과 unknown→조회 상태, mock/local/real·실험
    measured/mock/not_run 구분
  required: true
- id: AC4
  given: 합성 fixture와 허용된 identity; 선행 task 산출물을 사용
  expect: OpenAPI/예제 round-trip·변경 이력·미구현 route 표기 일치. 정상/deny/미승인/본문 변경/ACL 변경/중복/timeout fixture가 schema와
    일치. EvalCase/Result는 evaluator/실행·모델·prompt·policy·dataset/source 버전·증거 및 pass/fail/error/not_run를
    분리; default trace allowlist 밖 raw 값 거절, 미지원 계약 version 명시 거절
  required: true
