acceptance_criteria:
- id: AC1
  given: 동일 합성 입력/seed·fake model/retrieval/tool, 분리된 DB의 native와 실제 NAT 진입점
  expect: 핵심 결과·정책·draft binding 일치, WorkService 한 번 호출. 관찰한 읽기 호출 수는 0보다 크고 native/NAT 동일; 부작용 중복·승인/checkpoint
    우회 없음. 서로 다른 DB의 alias 문자열 대신 각 run의 authorized ledger 연결과 의미상 동등성을 검사
  required: true
- id: AC2
  given: 성공/실패 fixture 및 optional extra 미설치 환경
  expect: 기본 FastAPI/mock import·실행은 NAT 없이 유지; NAT 선택 시 명시 unavailable. 설치된 NAT 경로 smoke는 skip/로컬 대체
    성공으로 처리하지 않음
  required: true
- id: AC3
  given: service.observations.ledger(run_id, principal)의 실제 local 관측과 NAT outer 실행
  expect: 영속 observation_id/sequence와 duration_ms·transport·origin을 run alias에 연결하고 coverage의 collected/uncollected/incomplete를
    보존한다. started intent·JSONL 중복 line은 실제 호출/부작용 성공이 아니며 incomplete는 평가 통과가 아니다. 미연결 ToolPort/publish/internal_nodes·streaming/HITL
    resume는 검증 완료로 주장하지 않고 provider token은 null, 원본이 없는 decision/approval/receipt ID도 null
  required: true
- id: AC4
  given: NAT telemetry/workflow output에 합성 private/secret canary
  expect: P1-006D allowlist를 exporter 이전에 적용; raw prompt/본문/인자/첨부가 파일·오류에도 없음. 추적된 ID는 인증 증명이 아니며 외부 전송
    기본 금지. 기존 outer LangSmith guard·owned empty callback manager·CLI 미import·output/profiler null 제한을
    유지
  required: true
