schema_version: '1.0'
id: P0-028
title: NAT 평가 adapter·installed smoke와 native 동등성
objective: 기존 LangGraph/WorkService 밖의 adapter에서 비대화형 대표 경로를 실행하고 실제 NAT 설치 경로의 추적/동등성을 검증한다.
kind: task
source_tasks:
- P0-027
- P1-006
requirement_refs:
- docs/EVALUATION_CONTEXT.md
priority: P0
status: done
spec_state: ready
unresolved: []
workstream: integration/evaluation
execution_role: worker
estimated_effort: 1.5
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: local/mock; 제품 실행과 평가 도구의 실제 실행 여부를 별도 기록
scope:
  included:
  - 실제 설치/조사된 NAT1.8.0의 programmatic EvaluationRun(EvaluationRunConfig(config_file=load_config(...), write_output=False,
    endpoint=None, reps=1)).run_and_evaluate()를 사용한다. wrapper-only 검사는 실제 평가 실행을 대신하지 않는다.
  - nat_eval.py에서 optional import 및 명시적 local evaluator 등록 후 공식 load_config의 plugin discovery 순서를 사용한다.
    직접 Config.model_validate만 호출하면 nested discriminator 등록이 누락됨을 실제 합성 probe에서 확인했다. 별도 pyproject entrypoint/패키지
    변경은 현재 필요 없다.
  - builtin langgraph_wrapper의 메시지형 외부 graph 노드 하나에서 WorkService.run을 한 번 호출한다. case_id만 NAT 입력에 넣고 요청/신원은
    신뢰된 합성 harness에서 구성한다. container lifecycle·분리 DB/checkpoint·현재 승인 상태를 우회하지 않는다.
  - NAT cli entrypoint는 import 시 load_dotenv를 호출하므로 사용하지 않는다. config에는 workflow.env=null, general.telemetry.logging/tracing={},
    eval.general.output/profiler=null, max_concurrency=1, per_input_user_id=false, validate_llm_endpoints=false를
    명시한다. output=null은 write_output=false여도 가능한 cleanup을 막는 별도 조건이다.
  - 빈 NAT telemetry 설정은 ambient LangSmith 환경변수를 끄지 않는다. EvaluationRun 전체를 public tracing_context(enabled=False,
    parent=False)로 감싸 outer wrapper graph도 보호한다. 합성 ambient flags와 fake tracer/outbound spy로 검증하며 nat.cli.entrypoint
    미import도 확인한다. P1-006D native guard만으로 outer graph 검증을 대신하지 않는다.
  - NAT 최종 message에는 안전한 상태/관찰 참조만 넣고 원문 DRAFT·prompt·tool 인자를 반환하지 않는다. 원래 결과는 테스트 내부 native/NAT 비교에만
    사용한다. 외부 telemetry 없이 P1-006D 실제 allowlist export만 저장한다.
  - write_output=false는 FileEvalCallback 자동 등록만 막는다. adapter가 empty callback manager를 직접 소유하고 caller/plugin
    callback 주입을 허용하지 않는다. native/NAT의 독립 DB alias 문자열 동일성 대신 실제 run-observation join 및 정책/본문 binding
    동등성을 비교한다.
  - 설치 extra에는 profiler가 없고 framework wrapping이 no-op인 범위를 확인했다. 관찰된 outer/service 경계만 보고하며 내부 자동 node/tool은
    uncollected, provider token 미제공은 null이다. upstream의 UsageStats 기본 0을 실측으로 보고하지 않는다.
  - 결정적 local evaluator는 관찰 계약 회귀만 판정한다. evaluation_results에서 예상 evaluator/case 수, 오류, workflow_interrupted,
    output 존재를 검사한다. evaluator 예외가 로그 후 누락될 수 있으므로 반환 성공만으로 passed를 만들지 않는다.
  excluded:
  - 실제 NVIDIA/Judge·팀원 승인/게시·OpenShell·UI·streaming/HITL resume 검증, 외부 게시/배포, 실제 env 접근
  - 새 framework/관측 서버/profiler 추가·core graph 재작성
  - 공통 DTO/설정/lock 임의 변경; coordinator 계약 변경 절차로 요청
  owned_paths:
  - src/rfa_mas/adapters/nat_eval.py
  - configs/nat/rfa_eval.yml
  - configs/nat/rfa_eval_cases.json
  - tests/test_nat_adapter.py
  - tests/test_nat_smoke.py
