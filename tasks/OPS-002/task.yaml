schema_version: '1.0'
id: OPS-002
title: 후속 통합 후 재검증 recovery·현재 일정 회귀 보수
objective: 완료 후 관련 소스가 정당하게 진화한 task를 새 baseline에서 재검증하되 기존 증거·fencing·범위 검사와 사용자 E2E 일정 변경을 보존한다.
