acceptance_criteria:
- id: AC1
  given: task A가 이미 통합·검증된 후 정당한 후속 commit이 A의 관련 소스 및 별도 파일을 변경
  expect: A가 stale/reserved로 유지되고 coordinator inspection + clean current feature baseline에서만 recovery/reverification
    가능; 원래 submission/evidence 보존
  required: true
- id: AC2
  given: 만료 미통합 worker, 오래된 branch, dirty tree 또는 옛 generation 요청
  expect: baseline reset으로 미통합/범위 밖 변경을 숨기지 못하며 stale token/revision·미검증 submit/close를 거절
  required: true
- id: AC3
  given: 후속 source에 실제 새 검증 결과와 canonical integration evidence 존재
  expect: 재검증한 A가 close되면 필요한 후속 dependency만 해제; 원래 검증을 새 source에 재사용하지 않음
  required: true
- id: AC4
  given: 승인된 E2E/기존 preflight 추정 이력에 P1-006 1→2h, P0-020 1.5→3h의 현재 승인 명세를 더하고 명시 control root로 source
    worktree를 감사
  expect: 현재 D1=8.5h, D2=10h, D3=12h, D4=8h, 추가 기술6h 및 직렬36.5h를 실제 task/project 합산으로 검증하고 초기31.5h(추가 기술4.5h)와
    중간34h 이력·migration/원문체크/최종gate를 보존; wrong/copied root는 계속 거절
  required: true
- id: AC5
  given: 이미 integrated consumer의 관련 계약 artifact가 새 provider commit에서 변경되어 reconcile이 verifying/reserved로
    표시
  expect: 역사적 통합 증거/commit 결합이 유효하고 활성 claim이 없는 stale consumer에 한해 coordinator의 계약 발행·명시 baseline 수락을
    허용한다. 기존 reservation/증거와 재검증 요구는 보존하고 active claim/미통합 제출/변조 evidence는 거절한다.
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC5
  type: command
  availability: available
  prerequisites:
  - 임시 Git/control fixture만 변경; 실제 claim/evidence 오염 금지
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/test_taskctl.py
  timeout_seconds: 180
  procedure: []
  assertions:
  - 통합된 task의 현재 clean baseline 재검증과 최초 provenance 보존을 실제 temp Git 이력으로 확인
  - 미통합/dirty/old branch·old claim·미검증 close 우회 불가
  - 역사적 통합 증거/commit 결합이 유효하고 활성 claim이 없는 stale consumer에 한해 coordinator의 계약 발행·명시 baseline 수락을 허용한다.
    기존 reservation/증거와 재검증 요구는 보존하고 active claim/미통합 제출/변조 evidence는 거절한다.
  runner: pytest
- id: V2
  ac_ids:
  - AC4
  type: command
  availability: available
  prerequisites:
  - TASK_CONTROL_ROOT를 실제 canonical root로 명시; 상태는 read-only, mutation tests는 tmp_path. 잘못된 root는 자동 fallback
    금지.
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/test_task_migration.py
  timeout_seconds: 120
  procedure: []
  assertions:
  - canonical 원문/task/DAG/ID/생성 view와 현재 D1=8.5h·D2=10h·D3=12h·D4=8h·추가 기술6h·직렬36.5h가 일치하고 초기31.5h 및 중간34h
    이력과 모든 final gate를 보존
  - source worktree에서는 명시 root 사용; cloned/wrong root 보호 유지
  runner: pytest
