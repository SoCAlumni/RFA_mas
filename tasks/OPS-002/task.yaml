estimated_effort: 0.5
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: 개발 control local; 임시 protocol fixture는 simulated이며 제품 AC 증거 아님
scope:
  included:
  - 이미 integrated였던 task가 후속 소스 변경으로 stale된 경우, coordinator inspection 후 clean 최신 feature baseline에서 재검증
    recovery를 허용한다. 최초 제출의 baseline/commit/evidence는 approaches에 보존한다.
  - 미통합/만료된 worker 회수는 기존 baseline을 유지하고 범위 밖 변경을 새 baseline으로 세탁하지 않는다. 수정된 현재 소스에 대해 새 worker 및 integration
    evidence/commit/close gate를 모두 요구한다.
  - E2E 공수 변경으로 D3 합계11h가 된 명세를 테스트에서 정직하게 검증하고 원래24h+기술4.5h+추가3h 기록을 보존. source worktree의 read-only migration
    감사는 명시 TASK_CONTROL_ROOT를 사용하며 잘못된 root guard를 우회하지 않음.
  - 역사적 통합 증거/commit 결합이 유효하고 활성 claim이 없는 stale consumer에 한해 coordinator의 계약 발행·명시 baseline 수락을 허용한다.
    기존 reservation/증거와 재검증 요구는 보존하고 active claim/미통합 제출/변조 evidence는 거절한다.
  excluded:
  - 새 task 관리 framework/서버/DB·자동 merge·임의 done
  - 기존 상태/evidence 삭제·제품 구현·실제 .env 접근
  owned_paths:
  - scripts/tasklib/cli.py
