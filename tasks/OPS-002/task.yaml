schema_version: '1.0'
id: OPS-002
title: 후속 통합 후 재검증 recovery·현재 일정 회귀 보수
objective: 완료 후 관련 소스가 정당하게 진화한 task를 새 baseline에서 재검증하되 기존 증거·fencing·범위 검사와 사용자 E2E 일정 변경을 보존한다.
kind: task
source_tasks:
- OPS-001
requirement_refs:
- TASK_EXECUTION_RULES.md
- docs/WORK_LOG.md
- RFA_E2E_Test_Scenarios_10_ko.md
priority: P0
status: done
spec_state: ready
unresolved: []
workstream: contracts/control
execution_role: worker
estimated_effort: 0.5
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: 개발 control local; 임시 protocol fixture는 simulated이며 제품 AC 증거 아님
scope:
  included:
  - 이미 integrated였던 task가 후속 소스 변경으로 stale된 경우, coordinator inspection 후 clean 최신 feature baseline에서 재검증
    recovery를 허용한다. 최초 제출의 baseline/commit/evidence는 approaches에 보존한다.
  - 미통합/만료된 worker 회수는 기존 baseline을 유지하고 범위 밖 변경을 새 baseline으로 세탁하지 않는다. 수정된 현재 소스에 대해 새 worker 및 integration
    evidence/commit/close gate를 모두 요구한다.
  - 승인된 현재 추정 P1-006 1→2h 및 P0-020 1.5→3h를 실제 project milestone 합산과 대조한다. D1=8.5/D2=10/D3=12/D4=8h, 추가
    기술6h, 직렬36.5h를 명시 검증하며 초기24h+E2E추가3h+기술4.5h=31.5h 및 앞선34h 이력을 보존한다. 이번 후속 소스 수정은 tests/test_task_migration.py와
    docs/TASK_REVALIDATION.md 두 파일만으로 제한하고 CLI/framework 구현은 변경하지 않는다. 명시 TASK_CONTROL_ROOT와 wrong/copied
    root guard를 유지한다.
  - 역사적 통합 증거/commit 결합이 유효하고 활성 claim이 없는 stale consumer에 한해 coordinator의 계약 발행·명시 baseline 수락을 허용한다.
    기존 reservation/증거와 재검증 요구는 보존하고 active claim/미통합 제출/변조 evidence는 거절한다.
  excluded:
  - 새 task 관리 framework/서버/DB·자동 merge·임의 done
  - 기존 상태/evidence 삭제·제품 구현·실제 .env 접근
  owned_paths:
  - scripts/tasklib/cli.py
  - tests/test_taskctl.py
  - tests/test_task_migration.py
  - docs/TASK_REVALIDATION.md
  read_only_paths:
  - scripts/tasklib/schema.py
  - scripts/tasklib/store.py
