acceptance_criteria:
- id: AC1
  given: Python 3.12.13/LangGraph 1.2.12/checkpoint 4.2.0, NAT 미설치 기준
  expect: release tag·공식 요구 범위·실제 설치 버전·resolver 결과를 기록; 기존 core pin을 조용히 바꾸지 않고 호환되는 최소 optional extra만
    고정
  required: true
- id: AC2
  given: 격리된 임시 venv와 fake model/합성 custom state
  expect: 실제 설치한 langgraph_wrapper 등록과 CompiledStateGraph/factory·message 변환을 smoke로 확인; NAT 없이 core mock
    import/부팅 가능
  required: true
- id: AC3
  given: tool callback·checkpoint/HITL/streaming 지원 범위 조사
  expect: 지원/미수집/미검증을 표로 기록하고 비대화형 대표 경로 및 adapter 계획을 제공; 원래 WorkService·인증·checkpointer 원본 유지
  required: true
- id: AC4
  given: resolve/import 또는 입력 변환 실패
  expect: 실패 command/versions와 해소 조건을 남겨 해당 NAT task만 blocked 처리; local 실행을 NAT 성공으로 대체하거나 KB/eval을 대기시키지
    않음
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC3
  - AC4
  type: manual
  availability: available
  prerequisites:
  - 후속 spike 실행 권한·Git baseline; 다운로드는 공개 package만, 비밀 파일 접근 없음
  cwd: .
  argv: []
  timeout_seconds: 1800
  procedure:
  - pyproject/uv.lock와 importlib.metadata 설치 버전 확인; 공식 release/tag의 langgraph_wrapper 및 package metadata를
    대조
  - mktemp로 격리 venv를 준비하고 선택 release의 최소 extra를 resolve/install; 실제 argv·시각·결과를 기록. 이번 명세에는 아직 선택 안 된
    버전을 설치 명령으로 꾸며 넣지 않음
  - wrapper의 custom WorkRequest/principal mapping, factory·메시지·callback 한계 확인; 성공 시 optional dependency/lock
    고정. 실패 시 설치 오류만 blocked, 통과로 제출 금지
  assertions:
  - core pin 유지·actual installed versions·선택 근거가 있다
  - 관측/재개 미지원 범위 및 실패 blocker가 명시되고 KB/eval에 NAT 선행을 추가하지 않았다
  runner: manual
- id: V2
  ac_ids:
  - AC2
  - AC3
  type: command
  availability: planned
  prerequisites:
  - 후속 task 구현 후 source worktree에서 실행. 임시 DB/합성 fixture, 실제 .env·외부 credential을 읽지 않음.
  - spike 파일 구현 및 선택 release 설치; 기본 core 환경과 NAT extra 환경을 각각 검사
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/spikes/test_nat_compatibility.py
  timeout_seconds: 120
  procedure: []
  assertions:
  - 실제 설치된 wrapper가 synthetic CompiledStateGraph를 한 번 실행하고 input/output shape를 확인
  - NAT 미설치 core 경로는 정상; NAT 선택 시 명시 unavailable, skip/미수집을 smoke 성공으로 기록하지 않음
  runner: pytest
