acceptance_criteria:
- id: AC1
  given: 동일 lexical query를 owner/다른 사용자·같은 회사/다른 회사·같은 이름 BU·project membership 없는 identity 및 owner→public
    target 조합으로 실행
  expect: 현재 head의 신뢰된 ACL로 후보 metadata부터 권한을 제한한다. 같은 회사와 BU membership을 모두 확인하며 누락 company·다른 회사 동명
    BU·역할 문장/임의 allowed_audiences만으로 허가하지 않는다. owner read는 public share 권한이 아니다. 프로젝트 membership의 실제 provider
    표현을 사용하고 domain 이름만으로 membership을 추정하지 않는다. 1.1 role/agent/target/endpoint는 server-bound descriptor와
    대조하고 caller 문자열은 grant가 아니다.
  required: true
- id: AC2
  given: 한 source 또는 다중 부모 요약의 부모 하나를 수정·삭제·ACL/share/정책 변경한 뒤 최신 검색, 선택 읽기, pending resume, 완료 resume
    재전송, run/work/session GET 실행
  expect: 모든 부모의 현재 revision·ACL·read/share/요청 endpoint 판단을 다시 확인하여 old summary/cache/context를 stale/restricted로
    처리한다. completed result뿐 아니라 run-linked assistant message 및 title/URI/source relation/review metadata에도
    허용되지 않은 canary가 없다. 저장 이력·원래 draft hash/승인 연결은 불변; 현재 불가한 draft를 일부 수정하고 옛 승인으로 재사용하지 않는다. pending
    거절 시 승인 원본/도구 재실행은 0회이고 completed replay는 재실행하지 않는다. immutable parent metadata와 실제 현재 조회로 판정하며 C11은
    합법적인 owner write/CAS ACL revision 뒤 응답만 관찰한다.
  required: true
- id: AC3
  given: 같은 fixture로 두 번 검색하고, 최신/이전 revision·명시적 tentative/conflicting 자료 및 유효한 단어가 전혀 일치하지 않는 query를
    사용
  expect: 현재 허용 revision만 deterministic lexical 점수·안정 tie-break로 반환한다. 무관한 자료 fallback은 없고 no-match/권한
    내 근거 부족은 insufficient로 반환한다. 확인된 잠정·충돌 표기를 보존하고 새 출시일·원인·확정 사실을 만들어 채우지 않는다. 제한된 자료의 존재/metadata를
    부족 사유로 노출하지 않는다.
  required: true
- id: AC4
  given: 본문 read spy와 외부 sink spy를 둔 L0 manifest/명시 source 선택; metadata 조회와 실제 읽기 사이 revision/권한 변경; 비공개
    부모·제목·요약·관계 canary
  expect: 허가된 후보 metadata를 먼저 얻고 선택·재허가된 source만 본문을 읽는다. 최신 부모 ACL/share/endpoint 판정 전에는 외부 embedding/reranker/LLM
    sink가 호출되지 않으며 미등록·미허용 endpoint는 fail closed다. public EvidenceBundle/context에는 비공개 본문뿐 아니라 금지 metadata도
    없다. frozen 1.0에는 없는 target/endpoint 정보를 있다고 가정하지 않고 제한된 local compatibility 경계와 1.1 reader 계약을 구분한다.
    PolicyBindings는 실제 발급/조회된 현재 판정 ID와 일치해야 한다. fabricated/expired/cross-principal 또는 restart 이전 receipt로
    본문 접근하지 못한다. Optional project_id absent/None schema 확장 뒤에도 기존 persisted KB write의 동일 provider-revision
    replay receipt/head와 원문 이력을 보존한다.
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC4
  type: command
  availability: planned
  prerequisites:
  - source worktree에서 임시 DB와 합성 identity/source만 사용; 실제 .env·외부 네트워크·키를 읽거나 사용하지 않는다.
  - main76b2186 통합 KB09bdb65/evaluator72a66d4와 published RFA-EXTENDED1.1 70f3416b baseline을 사용. 신규 reader/metadata/issuer/조회
    assertion은 구현 전 planned이며 미수집/skip은 pass가 아니다.
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/test_policy.py
  - tests/test_knowledge.py
  - tests/test_retrieval.py
  timeout_seconds: 120
  procedure: []
  assertions:
  - 허용 owner/company/BU/project fixture positive control과 cross-company 동명 BU·company 누락·사칭·owner read→public
    share negative가 모두 검증됨.
  - current-head/삭제/ACL 변경과 모든 부모 provenance를 재판정; L0 metadata부터 제한하고 selected source read spy·중간 권한 변경·외부
    sink 호출 기록으로 선필터를 입증.
  - no-match는 items empty/insufficient이며 정렬이 반복 재현됨; tentative/conflicting fixture 표기와 금지된 날짜/원인 생성 부재를
    확인.
  - 새 default local 검색은 실제 로컬 결과이고 explicit mock은 simulated 표시; 기존 immutable KB CRUD/migration 회귀 유지.
  - PolicyDecisionV11 issued ID가 registry 실제 결정과 일치; caller fabricated/expired/wrong principal·action·recipient·target·endpoint·source
    revision/policy refs 및 restart 이전 ID는 body reader 0회로 거절. unknown endpoint도 body read 전에 거절.
  - L0 body read 0회와 SQL 허용 후보 ranking/selected reader 횟수 검사. metadata와 read 사이 ACL revision 변경은 old ref
    재사용을 거절하고, public child+private parent·cycle·missing lineage 음성은 title/summary/관계까지 미노출.
  - metadata migration5는 기존 [1,2,3,4] 이력/원문/seed/head를 보존. trusted derived-write의 CAS/부모 검증/원자성 및 child
    생성 후 부모 하나의 수정·삭제·권한 변경을 재검증.
  - BU와 project를 서로 다른 값으로 둔 fixture에서 명시 project grant positive/누락·회수·동명 다른회사 negative를 검증한다. role/domain/BU
    위장이나 project_id 제거 업데이트는 grant를 만들지 못하며 public context는 sender project member여도 제한 source의 body/title/relation을
    받지 않는다.
  - 기존 schema의 동일 KB 요청/fingerprint/receipt를 가진 persisted DB를 fixture로 재현한 뒤 upgrade 및 absent/null project_id
    replay가 원래 source/revision receipt와 head를 유지함을 검증한다. 기존 company_id=None canonicalization은 바꾸지 않고 실제
    project_id 변경은 새 CAS revision 또는 conflict다.
  runner: pytest
- id: V2
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC4
  type: command
