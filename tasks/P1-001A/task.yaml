schema_version: '1.0'
id: P1-001A
title: 권한 선필터·최신 lexical 검색·무효화
objective: 최신 허용 근거만 답변에 쓰고 수정/권한 회수 후 과거 요약이 공개 응답으로 재유입되지 않게 한다.
kind: task
source_tasks:
- P1-001A
requirement_refs:
- docs/PRODUCT_REQUIREMENTS.md
- docs/archive/TASKS_2026-09-26.md
- docs/EVALUATION_CONTEXT.md
priority: P0
status: verifying
spec_state: ready
unresolved: []
workstream: knowledge
execution_role: coordinator
estimated_effort: 1.5
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: mock 필터/ranking만 verified; lifecycle missing/not_run. 저장·권한·검색 local(false), mock provider는
  simulated=true 유지. NeMo/벡터 없이 완료 가능.
scope:
  included:
  - RetrievalPort 뒤 local lexical 검색(FTS는 필요 시); DB owner/domain/ACL 제한 후 ranking·context 구성. source lifecycle/latest
    revision과 derived item stale/restricted 계약.
  - P1-001B가 소비할 권한 제한 L0 manifest/현재 revision·policy 조회와 선택 source 구간 읽기 경계. RetrievalPort 변경 원본은 P0-014이며
    private title·summary·관계도 사전 제한.
  - P0-016의 임시 multiple-revision fail-closed를 현재 head/ACL 조회로 연결. 과거 completed replay·session/run GET도
    최신 source 읽기/공유 판정을 적용해 revoked 원문·DRAFT·metadata가 재노출되지 않게 한다. 이력 자체는 삭제하지 않는다.
  - 로컬 lexical adapter 구현이 검증된 뒤에만 기본 검색을 local로 전환한다. mock은 명시적 fixture 경로, 미지원 real의 fallback 금지. 검색
    무관자료 fallback 없이 insufficient 반환.
  - '구현 순서: P1-001의 통합된 current-head/ACL/provenance 조회를 먼저 재사용 → 권한 제한 metadata 후보와 선택 본문 reader → 실제
    local lexical 검색/default·관측 mode → 공통 현재 근거 검사로 pending resume 및 과거 outward result/session message
    보호. 별도 head/ACL DB 원본을 만들지 않는다.'
  - 조회 시 저장 이력/승인 hash는 수정하지 않는다. 현재 재사용 불가한 DRAFT 전체와 파생 assistant message·review/evidence metadata를
    안전한 restricted/stale outward projection으로 대체하며, 승인된 본문 일부를 지우고 기존 승인으로 유효하다고 반환하지 않는다. 소유자가 직접 작성한
    사용자 메시지와 source-derived assistant message는 구분한다.
  - 기본 local 전환은 RETRIEVER_BACKEND 기존 이름을 재사용하고 inspect_configuration·bootstrap의 실제 adapter/observed mode와
    일치시킨다. mock 실패 시나리오는 명시적 mock fixture 설정으로 유지하며 정상 local 검색에서 시나리오 문자열이 허가·외부 호출·불관련 자료 fallback을
    만들지 않는다.
  - 최신 source의 outward projection을 API의 work/run/session 응답에 최소 연결한다. P1-006 평가 C11은 실제 회수 후 GET/terminal
    resume로 재평가하며 기존 제품 결함을 기대값에 고정하지 않는다. evaluator 자체의 누락/위반 판정은 약화하지 않고 필요한 fixture 기대값만 갱신한다.
  - C11 native 평가 준비는 통합된 KnowledgeService의 owner write/ACL revision 경로로 바꾸고 수정 후 실제 GET/terminal resume만
    평가한다. 철회 후 안전한 restricted/deny 응답(금지 DRAFT 없음)을 누출 실패로 오판하지 않는다. known violation/unknown 우선순위와 독립
    negative-fixture 회귀를 유지하며 평가 엔진을 재작성하지 않는다.
  - '확정 baseline: main76b2186의 KB09bdb65/migration4와 evaluator72a66d4. write_knowledge/get_knowledge/list_knowledge는
    owner 관리용이며 공유 검색에 오용하지 않는다. kb_sources.current_revision과 kb_source_revisions의 deleted metadata가 유일한
    head/lifecycle 원본이다.'
  - 신규 application/source_access.py의 작은 공통 helper와 repository metadata/selected-reader 경계를 둔다(새 서비스/engine
    아님). SQL은 current/nondeleted/nonrestricted domain 후보에서 ACL 필드만 먼저 선택한다. title/URI/관계 반환·ranking 전에
    authenticated principal의 owner/company+BU 교집합과 목표 공유 범위를 확인한다. business_units/KnowledgeAcl.memberships는
    BU일 뿐 project grant가 아니다. 별도 trusted server-side resolver가 (user_id, company_id)에 명시 project IDs를
    반환하며 default empty이고 매 호출 fresh 조회한다. request/role/domain/BU로 project grant를 추론하지 않는다. 실제 identity
    provider 구현·검증을 뜻하지 않는다.
  - project restriction은 optional 1.1 KnowledgeAcl.project_id 및 KnowledgeDocumentV11.project_id로 기록한다(1.0
    TrustedPrincipal/KnowledgeDocument는 그대로). 이 값은 resource 제한이며 caller grant가 아니다. bootstrap이 주입한 같은
    trusted project resolver를 owner write/read/history/update/delete와 공유 reader가 재사용한다. 수정 전 기존 project
    scope와 수정 후 scope를 모두 검사해 grant 회수 뒤 project_id 삭제/public 재라벨로 우회하지 못한다. 현재 지원하지 않는 조직/프로젝트 scope
    조합은 명시 거절한다. project-restricted source는 sender에게 membership이 있어도 public/anonymous context에서 항상 거절하며
    unrestricted public FAQ는 유지한다.
  - 1.1 bound-reader 기본 recipient 지원은 owner의 local-preview와 unrestricted-public local-preview로 제한한다. 조직/project
    읽기는 owner preview에서 현재 grant 교집합으로 가능하다. 임의 destination/channel 문자열로 수신자의 company/project membership을
    생성하지 않는다. 실제 business-unit/company recipient와 외부 endpoint sharing/egress는 P1-005의 별도 trusted recipient
    계약 전까지 명시 unsupported/deny다. 기존1.0 lexical graph 호환 결과는 권한 제한 local preview이지 정확한 실제 대상 공유 승인 증거가
    아니다.
  - optional project_id 추가의 backward fingerprint를 보존한다. 기존 write_knowledge fingerprint는 old model_dump의
    기존 None/default를 포함하므로 새 acl.project_id가 absent/None일 때 이 새 field만 canonical fingerprint에서 제외한다(모든
    None 일괄 제거 금지). 기존 persisted provider-revision receipt/fingerprint/current head/raw revision은 재작성하지
    않는다. non-null project restriction은 새 fingerprint와 CAS revision을 요구한다.
  - LocalRetrieval.search(1.0)는 고정 local compatibility 경로다. request.allowed_audiences는 trusted ACL 결과를
    줄이는 필터일 뿐 grant/정확한 target/cloud egress 증명이 아니다. authorized SQL 후보의 title/content lexical score를 DB
    내부에서 계산하고 안정 tie-break로 selected source만 application 본문 reader에 전달한다. no-match는 empty/insufficient이고
    불관련 fallback은 없다. 원문 hash는 저장된 정확한 원문 기준이며 frozen1.0 출력의 whitespace 투영과 혼동하지 않는다.
  - ContextRequest1.1는 bootstrap이 주입한 불변 bound-access descriptor(principal/agent/role/domain/정확한 target/허용
    endpoint)와 일치해야 한다. descriptor는 request/persona/LLM 문자열에서 생성하지 않고 매 호출의 fresh trusted principal과 서버가
    정한 역할 범위로 만든다. 장기 reader/checkpoint에 membership grant를 저장하지 않는다. 기본 graph search와 별개인 내부 bound context-reader
    factory만 준비하며 P0-020의 역할 lease 발급을 대신하지 않는다. unknown role/불일치 principal·target/미등록 또는 cloud endpoint는
    body read 전에 거절; 현재 허용 endpoint는 명시된 local/mock 메모리 consumer뿐이다.
  - Context PolicyBindings는 실제 LocalPolicy 결정 후 발급한 PolicyDecisionV11만 참조한다. bounded process-local issuer/lookup
    registry에 subject/action/read-share-egress/정확한 recipient·target·endpoint/all-source refs/current policy/expiry를
    기록한다. ID만 받은 allow를 신뢰하지 않고 selected read 때 issuer lookup+현재 ACL/revision+binding+expiry를 검증한다. 임의·다른
    principal·만료 ID는 거절; restart는 ID lookup miss로 fail closed/새 판정 발급. 단기 local decision receipt이며 승인
    원본·외부 서비스 인증 token·영속 policy DB가 아니다. PolicyPort.evaluate1.0은 보존하고 미지원 HTTP issuer는 local로 몰래 대체하지
    않는다.
  - 현재 원문 DTO에는 부모가 없으므로 migration5의 작은 immutable kb_revision_context metadata(source/revision, raw content_hash,
    character_count, epistemic_state, parent_refs)를 제안한다. 기존 원문은 같은 저장 트랜잭션/한 번의 migration backfill에서
    hash·root 부모없음으로 기록하며 KB/seed/head를 새로 만들지 않는다. 내부 trusted derived-write는 기존 owner/CAS 저장을 재사용하면서
    child의 새 revision과 서버 조회로 검증한 전체 부모 refs를 원자 저장한다. 일반 공개 KnowledgeWrite에는 caller parent/allow 권한 필드를
    추가하지 않는다. 빈/누락/변조 lineage를 derived라고 인정하지 않으며 부모 일부 생략·나중 변경은 불허한다.
  - Derived metadata를 반환하기 전 전체 parent closure의 current head/nondeleted/read/share/endpoint/revision을
    검사한다. cross-domain·cycle·missing parent 및 bounded closure 초과는 fail closed. 부모 하나가 바뀌면 derived title/summary/관계까지
    restricted 또는 stale로 처리하며 현재 source가 public이어도 private parent를 우회하지 못한다. L0는 본문 0회; L1은 이미 저장된 허용
    요약만, 자동 생성/3중 복제 없음; L2는 명시 선택 ref를 같은 read transaction에서 재검증하고 본문을 읽는다. ContextItem1.1 raw excerpt/측정
    character count를 보존하고 기존1.0 schema는 변경하지 않는다.
  - ResumePolicy는 공통 source-access helper를 재사용하여 현재 원문 hash와 모든 부모를 확인한다. WorkService.present_result는
    owner 확인 후 같은 helper로 outward만 검사한다. revoked/stale 결과는 draft/review와 해당 evidence metadata를 통째로 제거하고
    기존 안전한 policy_denied/resume_review_required 오류·stop_reason만 반환한다. 역사 run/publication 상태는 역사 사실로 보존하되
    현재 사용 가능/승인 유효로 해석하지 않는다. 부분 본문 redaction 후 옛 approval hash 재사용 금지. DB/checkpoint/result_json/draft_json/approval
    receipt 원본은 변하지 않는다.
  - WorkService의 session outward helper가 각 run을 한 번 projection하고 run_id로 연결된 assistant message도 같은 판정으로
    고정 restricted 문구로 대체한다. source-derived message인데 대응 result/근거가 확인되지 않으면 fail closed; user-authored
    message는 별도 원본으로 보존한다. API /v1/sessions 상세는 raw SessionService.get이 아니라 이 outward 결과를 사용한다. work GET/run
    GET/terminal resume도 같은 helper를 거치고 조회를 이유로 Model/Response/Tool을 재실행하지 않는다.
  - C11은 container.startup 뒤 KnowledgeService.write로 fixture owner의 새 합성 public source를 생성하고 초기 native
    draft가 그 source를 실제 사용했는지 확인한다. 같은 source/provenance에 provider_revision 새 값+expected_revision+private
    ACL을 owner로 write한 후 외부 fixture identity의 실제 service.get 응답을 post_change_result로 수집한다. mutable upsert/SQL
    우회 금지. safe restricted 응답(draft/review 없음+명시된 안전한 거절 이유)은 pass, 실제 금지 자료 잔존은 fail, 호출 실패·미관측은 unknown/error다.
    C11 외 Tool/publication·미실행 variant/quality/final gate는 그대로 미검증이다.
  - 평가기 기본 synthetic_settings는 실제 default local reader를 사용한다. 기존 mock-only insufficient/timeout 시나리오만
    명시적으로 mock을 선택하고 ambient env를 읽지 않는다. C01/C02 및 CLI verdict는 실제 실행 결과로 갱신하되 unit test pass를 전체12사례
    pass로 바꾸지 않는다. 기존 독립 forged-record/security failure 테스트와 known violation 우선순위는 보존한다.
  - migration5 등록에 따른 tests/test_teams.py 변경은 기대 migration 목록 [1,2,3,4,5] 한정이며 기존 team/runtime/owner/CAS/security
    assertion을 유지한다. tests/test_sessions.py/test_knowledge.py의 migration 회귀도 기존 이력 보존을 확인한다.
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
  - P1-001B의 L0/L1/L2 요약 최적화·자동 생성 및 P1-005의 모든 Model/Response/Tool/외부 Judge 호출부 egress 조립은 별도 task다.
    이번에는 해당 consumer가 사용할 현재 ACL/부모/endpoint 선판정 reader 경계를 검증하며 실제 cloud 통합을 주장하지 않는다.
