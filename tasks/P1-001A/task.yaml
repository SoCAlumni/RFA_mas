schema_version: '1.0'
id: P1-001A
title: 권한 선필터·최신 lexical 검색·무효화
objective: 최신 허용 근거만 답변에 쓰고 수정/권한 회수 후 과거 요약이 공개 응답으로 재유입되지 않게 한다.
kind: task
source_tasks:
- P1-001A
requirement_refs:
- docs/PRODUCT_REQUIREMENTS.md
- docs/archive/TASKS_2026-09-26.md
- docs/EVALUATION_CONTEXT.md
priority: P0
status: todo
spec_state: draft
unresolved:
- P0-014의 확장 DTO/상태 fixture baseline(RFA-EXTENDED 1.1)을 수신·검토하고 contract_refs digest를 고정해야 한다.
- Re-read RFA-EXTENDED 1.1; coordinator edit-spec must accept new digest
- P1-001 migration4/current-head/immutable ACL revision·삭제·provenance provider가 아직 구현/검증 중이다. 실제 통합 DTO/port/API와
  모든 부모 참조/회사·project membership 표현을 확인한 뒤에만 소비 계약과 실행 가능 상태를 확정한다.
- 1.0 RetrievalRequest/EvidenceRef에는 exact target/endpoint/parent ACL revision이 없다. 구현 전에 coordinator가
  최소 local compatibility projection과 1.1 authorized metadata/selected-reader 결합을 명시해야 한다. cloud/공유 판단을
  allowed_audiences나 role 문자열로 추정하지 않으며 필요한 graph/public DTO scope 확대는 별도 승인한다.
- P1-006의 actual 관찰/evaluation consumer가 아직 구현·검증 중이다. source 변경 전 통합된 helper/검증 결과를 확인하고 C11 조회/기대와 backend
  선택을 현재 실제 경로에 맞춘다.
workstream: knowledge
execution_role: coordinator
estimated_effort: 1.5
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: mock 필터/ranking만 verified; lifecycle missing/not_run. 저장·권한·검색 local(false), mock provider는
  simulated=true 유지. NeMo/벡터 없이 완료 가능.
scope:
  included:
  - RetrievalPort 뒤 local lexical 검색(FTS는 필요 시); DB owner/domain/ACL 제한 후 ranking·context 구성. source lifecycle/latest
    revision과 derived item stale/restricted 계약.
  - P1-001B가 소비할 권한 제한 L0 manifest/현재 revision·policy 조회와 선택 source 구간 읽기 경계. RetrievalPort 변경 원본은 P0-014이며
    private title·summary·관계도 사전 제한.
  - P0-016의 임시 multiple-revision fail-closed를 현재 head/ACL 조회로 연결. 과거 completed replay·session/run GET도
    최신 source 읽기/공유 판정을 적용해 revoked 원문·DRAFT·metadata가 재노출되지 않게 한다. 이력 자체는 삭제하지 않는다.
  - 로컬 lexical adapter 구현이 검증된 뒤에만 기본 검색을 local로 전환한다. mock은 명시적 fixture 경로, 미지원 real의 fallback 금지. 검색
    무관자료 fallback 없이 insufficient 반환.
  - '구현 순서: P1-001의 통합된 current-head/ACL/provenance 조회를 먼저 재사용 → 권한 제한 metadata 후보와 선택 본문 reader → 실제
    local lexical 검색/default·관측 mode → 공통 현재 근거 검사로 pending resume 및 과거 outward result/session message
    보호. 별도 head/ACL DB 원본을 만들지 않는다.'
  - owner의 읽기 권한과 대상별 공유 권한은 별도 판정한다. BU는 company와 membership 모두 일치해야 하며 누락·다른 회사의 동명 BU·메시지 role 사칭은
    거절한다. 현재 trusted principal의 project membership 표현은 P1-001 계약 확인 전 발명하지 않는다.
  - 조회 시 저장 이력/승인 hash는 수정하지 않는다. 현재 재사용 불가한 DRAFT 전체와 파생 assistant message·review/evidence metadata를
    안전한 restricted/stale outward projection으로 대체하며, 승인된 본문 일부를 지우고 기존 승인으로 유효하다고 반환하지 않는다. 소유자가 직접 작성한
    사용자 메시지와 source-derived assistant message는 구분한다.
  - 기본 local 전환은 RETRIEVER_BACKEND 기존 이름을 재사용하고 inspect_configuration·bootstrap의 실제 adapter/observed mode와
    일치시킨다. mock 실패 시나리오는 명시적 mock fixture 설정으로 유지하며 정상 local 검색에서 시나리오 문자열이 허가·외부 호출·불관련 자료 fallback을
    만들지 않는다.
  - 최신 source의 outward projection을 API의 work/run/session 응답에 최소 연결한다. P1-006 평가 C11은 실제 회수 후 GET/terminal
    resume로 재평가하며 기존 제품 결함을 기대값에 고정하지 않는다. evaluator 자체의 누락/위반 판정은 약화하지 않고 필요한 fixture 기대값만 갱신한다.
  - C11 native 평가 준비는 통합된 KnowledgeService의 owner write/ACL revision 경로로 바꾸고 수정 후 실제 GET/terminal resume만
    평가한다. 철회 후 안전한 restricted/deny 응답(금지 DRAFT 없음)을 누출 실패로 오판하지 않는다. known violation/unknown 우선순위와 독립
    negative-fixture 회귀를 유지하며 평가 엔진을 재작성하지 않는다.
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
  - P1-001B의 L0/L1/L2 요약 최적화·자동 생성 및 P1-005의 모든 Model/Response/Tool/외부 Judge 호출부 egress 조립은 별도 task다.
