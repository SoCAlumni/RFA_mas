acceptance_criteria:
- id: AC1
  given: 이 Mac에서 공식 지원 OpenShell(v0.1.1, VM driver)과 합성 정책·sentinel·허용/비허용 endpoint(각각 사전 health 확인)
  expect: 조사 worker 역할 sandbox에서 허용 endpoint 읽기는 성공하고, 비허용 endpoint·호스트 sentinel 경로 접근은 OpenShell 정책 로그/감사
    기록과 함께 거절된다. 파일 부재·endpoint 다운은 정책 거절로 집계하지 않고 inconclusive로 둔다.
  required: true
- id: AC2
  given: 실행 worker 역할 sandbox와 승인된 CPU 계산 스크립트
  expect: 승인 작업 디렉터리의 계산은 성공하고 범위 밖 쓰기/실행 시도는 실제 실행 계층에서 거절되며, 증거에 sandbox/policy 식별자·명령·결과·지연(cold 준비/warm
    실행/거절)이 연결된다.
  required: true
- id: AC3
  given: worker→다른 팀 worker 직접 메시지와 worker→Supervisor 메시지(DebateLease 없음)
  expect: 애플리케이션 SupervisorBus 결정(직접 메시지 거절, Supervisor 전달 허용)을 OpenShell 결과와 별도 판정으로 기록한다. 한쪽 결과로 다른
    쪽 통제를 증명하지 않는다.
  required: true
- id: AC4
  given: 키·비밀·실제 운영 자원 없이 opt-in live 실행
  expect: 기본 테스트 실행에서는 live 경로가 명시적 not_run(skip 사유)이며 skip을 통과로 세지 않는다. 실제 실행 결과는 docs/evidence/openshell.md에
    real/local-standalone으로 기록하고 teammate runtime(다영) 연동·NemoClaw 증거로 표현하지 않는다.
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC3
  - AC4
  type: command
  availability: available
  prerequisites:
  - source worktree; OpenShell 불필요한 결정적 분류 규칙·SupervisorBus 검사만
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/integration/test_openshell_live.py::test_network_deny_requires_policy_record_and_healthy_endpoint
  - tests/integration/test_openshell_live.py::test_network_allow_requires_openshell_allowed_record
  - tests/integration/test_openshell_live.py::test_filesystem_absence_or_unproven_permission_error_is_inconclusive
  - tests/integration/test_openshell_live.py::test_supervisor_bus_boundary_is_measured_without_openshell
  timeout_seconds: 300
  procedure: []
  assertions:
  - 파일 부재·endpoint 다운·정책 기록 없는 일반 오류는 denied_by_policy가 아니라 inconclusive로 분류된다.
  - SupervisorBus는 worker→worker를 direct_message_denied로 거절하고 worker→Supervisor를 전달한다(OpenShell 결과와 별도
    판정).
  runner: pytest
- id: V2
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC4
  type: manual
  availability: available
  prerequisites:
  - openshell v0.1.1 VM driver 실제 실행 결과 report.json(run 0926181417)과 docs/evidence/openshell.md
  cwd: .
  argv: []
  timeout_seconds: 600
  procedure:
  - ~/.cache/rfa-mas/openshell-e2e05/runs/<run>/report.json의 status·label·matrix(met/observed/evidence_line)·supervisor_bus·latency를
    검토
  - docs/evidence/openshell.md의 표와 report가 일치하는지 대조
  assertions:
  - 조사 worker 역할 sandbox에서 허용 endpoint 읽기는 성공하고, 비허용 endpoint·호스트 sentinel 경로 접근은 OpenShell 정책 로그/감사 기록과
    함께 거절된다. 파일 부재·endpoint 다운은 정책 거절로 집계하지 않고 inconclusive로 둔다.
  - 승인 작업 디렉터리의 계산은 성공하고 범위 밖 쓰기/실행 시도는 실제 실행 계층에서 거절되며, 증거에 sandbox/policy 식별자·명령·결과·지연(cold 준비/warm
    실행/거절)이 연결된다.
  - 애플리케이션 SupervisorBus 결정(직접 메시지 거절, Supervisor 전달 허용)을 OpenShell 결과와 별도 판정으로 기록한다. 한쪽 결과로 다른 쪽 통제를
    증명하지 않는다.
  - 기본 테스트 실행에서는 live 경로가 명시적 not_run(skip 사유)이며 skip을 통과로 세지 않는다. 실제 실행 결과는 docs/evidence/openshell.md에
    real/local-standalone으로 기록하고 teammate runtime(다영) 연동·NemoClaw 증거로 표현하지 않는다.
  runner: manual
