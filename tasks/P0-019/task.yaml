product_mode: Task/TeamInstance 테이블 없음; missing/not_run. registry·중복 방지 local(false), provisioning fixture
  mock(true). 외부 의존 없음; actual identity/lifecycle는 P1-008B.
scope:
  included:
  - product_task_owners를 owner/domain 원본으로 유지하고 Task 상세·팀/member lifecycle·owner별 생성 멱등 기록을 migration으로
    추가한다. 기존 registry-only Task의 목표를 추정하지 않는다.
  - 최신 trusted selector로 owner/domain·승인 pin·capability/runtime·예산을 재검사한다. TeamSpec은 승인 template를 변형하지
    않고 definition_digest와 별도 execution_budget을 전달하며 member 준비/정리 결과를 1.1 additive 계약으로 명시한다.
  - boot-time selector snapshot을 재사용하지 않고 invocation마다 현재 grant/pin/runtime/budget을 trusted resolver에서
    받는다. prepare/cleanup 응답은 재검증한 exact persisted spec·owner/task/team/domain·digest·budget·member 집합·예상
    mode에 binding한다. schema-valid 타인 응답이나 model_copy 변조도 성공으로 수용하지 않으며 타인 응답의 ID로 cleanup을 호출하지 않는다.
  - Task당 occupied 팀 슬롯을 DB unique와 BEGIN IMMEDIATE로 예약한다. 준비/정리 IO는 DB 트랜잭션 밖에서 수행하고 고정 operation key·generation/CAS로
    재시도와 늦은 응답을 처리한다. cleanup 미확인·unknown·실패 슬롯은 새 팀으로 덮어쓰지 않는다.
  - RuntimePort prepare/cleanup의 LocalRuntime 구현과 부분 실패 fixture를 추가한다. HTTP 구현 전에는 명시적 unsupported이며 local로
    fallback하지 않는다. 역할 실행·예산 소진은 P0-020에 유지한다.
  - bootstrap이 관찰 decorator 이전의 실제 configured RuntimePort와 신뢰된 lifecycle-support/expected-mode descriptor를
    TeamFactory에 명시적으로 주입한다. Factory는 decorator의 prepare/cleanup 존재만으로 지원을 추정하거나 domain logic에서 .inner를
    탐색하지 않는다. 지원 여부는 예약·재사용 전에 확인한다. 기존 graph run의 관측은 유지하고 Factory lifecycle trace는 명시적으로 미수집으로 둔다. 준비·정리
    결과는 durable DB lifecycle 기록으로 검증하며 성공을 관측 실패/invalid_contract로 잘못 집계하지 않는다. observations.py나 trace
    task 범위는 확장하지 않는다.
  - 선행 P1-006D의 .agent/evidence/P1-006D/full-regression-01.json은 e634435 전체 회귀 532 passed/1 failed의 실제
    기록이다. 합성 환경변수 변경 전에 LangSmith.utils.get_env_var 캐시에 이전 false가 남아 ambient tracing positive control이
    실행되지 않은 독립적인 test-isolation 후속을 tests/test_trace_contract.py에서만 수정한다. 해당 합성-env 테스트 전후에 공개 env lookup
    cache를 초기화하고 warm-cache/실행 순서 회귀에서도 원래 positive/negative assertion을 유지한다. 제품 guard·tracing_is_enabled·global
    conftest는 변경하지 않는다. 이는 이전 immutable-draft 오류의 네 번째 retry가 아니며 기존 실패·증거를 보존한다.
  excluded:
  - 역할 graph 실행·실제 OpenShell 격리·UI·외부 게시·실제 env 접근
  - 승인 template/selector 소스 변경 및 frozen 1.0 계약 변경
