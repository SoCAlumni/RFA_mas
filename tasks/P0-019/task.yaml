  - 동시 생성과 migration 재적용에서 Task당 occupied 팀 하나 및 기존 owner/session 데이터가 유지된다.
  - 멱등 충돌·타인 owner/domain·위조 선택·폐기 pin·예산 변형을 runtime 실행 전에 거절한다.
  - 재시작/다른 session에서도 같은 팀과 승인 template를 재사용하며 별도 execution_budget이 실제로 전달된다.
  - member 부분 실패/unknown/cleanup 실패/늦은 응답을 기록하고 반쪽 실행·중복·silent fallback이 없다.
  - 같은 service 인스턴스에서 grant/pin 회수 후 재사용을 차단하고 schema-valid 타인 응답·mode/budget/member/model_copy 변조를 수용하거나
    타인 runtime을 cleanup하지 않는다.
  - decorator의 lifecycle 메서드가 있어도 실제 configured runtime이 미지원이면 슬롯 예약·runtime IO 전에 거절한다. 지원되는 Factory는
    주입된 원래 RuntimePort를 사용하며 준비·정리의 durable DB 결과와 trace 미수집을 구분한다. 기존 graph run 관측 경로는 보존한다.
