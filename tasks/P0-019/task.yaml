  - tests/test_trace_contract.py의 합성-env fixture는 LangSmith.utils.get_env_var cache를 테스트 전후 초기화한다. 이전
    false가 캐시된 warm/order 조건을 재현하되 tracing_is_enabled 대체·positive/negative assertion 완화·global conftest
    변경은 하지 않는다.
  cwd: .
  argv:
