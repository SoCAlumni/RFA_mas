  - tests/test_contract_baseline.py
  - tests/test_trace_eval_contract.py
  - tests/test_team_selector.py
  - tests/test_sessions.py
  - tests/test_local_adapters.py
  - tests/test_trace_contract.py
  timeout_seconds: 120
  procedure: []
  assertions:
  - 기존 selector/session/local adapter 회귀와 frozen/extended schema 및 fixture 검사가 통과한다.
