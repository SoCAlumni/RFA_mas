acceptance_criteria:
- id: AC1
  given: 독립 repository 인스턴스가 같은 Task에 동시에 팀 생성을 요청하며 기존 session/owner registry도 존재
  expect: 원본 owner/domain과 기존 데이터를 보존하고 Task당 occupied 팀 하나를 DB unique/transaction으로 보장한다. 준비/실행뿐 아니라
    cleanup 미확인·unknown/실패도 슬롯을 유지한다. migration 반복 적용은 안전하다.
  required: true
- id: AC2
  given: 동일 owner의 같은 멱등 key 재전송 또는 다른 내용, 타인 Task/domain과 위조 선택·변형 예산·폐기된 승인 pin
  expect: 같은 내용은 기존 Task/team, 다른 내용은 conflict. 권한/승인 불일치는 runtime 호출 전에 거절하며 타인/없는 Task는 동일 안전한 오류이다.
    caller decision을 권한으로 사용하지 않는다. bootstrap이 주입한 실제 runtime 지원 descriptor로 lifecycle 지원 여부를 예약·재사용 전에
    검사하며 decorator 메서드 존재를 지원 증거로 사용하지 않는다.
  required: true
- id: AC3
  given: 같은 Task의 다른 session/run 및 DB 재시작 이후 요청
  expect: invocation마다 최신 권한·승인 template/pin·runtime·실행 예산을 trusted resolver로 재확인하고 기존 팀을 재사용한다. 승인 template는
    그대로 보존하며 runtime execution_budget은 selector 교집합과 일치한다. 유효하지 않은 팀을 몰래 새 팀으로 교체하지 않는다.
  required: true
- id: AC4
  given: 두 번째 member prepare 실패, timeout/unknown, cleanup 실패, 재전송과 늦은 응답, 잘못된 owner/spec/mode/budget/member를
    가진 schema-valid 또는 model_copy 변조 응답
  expect: 준비 성공/미실행/불명 및 cleanup 대상을 기록한다. 요청과 정확히 일치하지 않는 응답은 occupied/unknown으로 보존하며 타인 응답 ID로 cleanup하지
    않는다. 부분 팀 실행·새 중복 팀을 금지하고 고정 key와 CAS로 상태를 보존한다. HTTP 미지원은 명시 오류이며 local fallback이 없다. Factory lifecycle은
    durable DB 기록으로 확인하고 trace에는 명시적으로 미수집이며 기존 graph run 관측은 유지한다. 선행 전체 회귀에서 발견된 합성-env 테스트 캐시 격리는 테스트
    전후 cache 초기화만으로 보수하고 warm/order 조건에서도 원래 tracer positive control과 native guard negative control이 모두
    유지된다.
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC4
  type: command
  availability: planned
  prerequisites:
