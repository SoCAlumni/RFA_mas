acceptance_criteria:
- id: AC1
  given: authenticated owner 및 다른 사용자·위조 owner/company/membership 입력, 원문 공백·미분류 노트
  expect: 서버 identity로 생성/수정/삭제를 허가하며 미분류 private와 원문이 보존된다. 미등록/타인 자료는 동일 안전한 오류이고 조직 공유는 현재 membership을
    넘지 않는다.
  required: true
- id: AC2
  given: 동일/상이 provenance와 provider revision 재전송, 같은 revision 다른 내용, expected_revision 경쟁 수정, valid/bad/valid
    export
  expect: 동일 입력은 기존 receipt를 반환하고 revision 충돌 및 CAS loser는 안전하게 거절된다. 다른 provenance는 합쳐지지 않는다. 행별 partial
    receipt가 실제 성공/실패와 일치하고 실패 행 재처리가 성공 행을 중복시키지 않는다.
  required: true
- id: AC3
  given: 본문·ACL 수정 또는 삭제 이후 조회/검색용 projection과 legacy migration
  expect: 원문/revision/파생 참조 이력은 보존하며 current/nondeleted 자료만 기본 목록에 나온다. ACL 변경은 새 revision으로 이전 승인 binding을
    무효화한다. legacy 모호성은 추정하지 않고 제한하며 mutable upsert 우회가 없다.
  required: true
- id: AC4
  given: 기존 수정/삭제 DB의 재시작·동시 초기화, 새로운 임시 DB와 symlink/FIFO 대상
  expect: seed가 사용자 자료/삭제를 복원하거나 덮어쓰지 않고 migration 반복 적용이 안전하다. DB/WAL/SHM은 소유자 전용이며 비정규 대상은 fail closed한다.
    기존 세션·재개 검증의 기밀/승인 거절 기대 결과가 유지된다.
  required: true
