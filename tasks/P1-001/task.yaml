scope:
  included:
  - 기존 KnowledgeDocument 1.0과 원문 공백을 보존하며 1.1 입력/revision/ACL/partial receipt DTO, 노트 CRUD API, 고정 GitHub
    issue/Confluence export mapper를 추가한다. identity는 resolve_principal 원본을 재사용한다.
  - 서버 source ID와 owner/domain/provider/외부 namespace·ID를 매핑한다. provider revision과 서버 source revision을
    구분하고 immutable revision 및 명시 current head/CAS를 사용한다. 다른 provenance는 내용이 같아도 합치지 않는다.
  - 기본 private이며 owner만 수정/삭제한다. 조직 공유 선택은 서버 principal의 실제 company/membership에 한정하며 body의 owner/role을
    권한으로 쓰지 않는다. ACL 변경도 새 서버 revision을 발급하여 이전 승인 binding을 재사용하지 못하게 한다.
  - 동일 provenance/provider revision/fingerprint 재전송은 기존 receipt, 같은 revision 다른 내용은 conflict이다. export는
    행별 권한·트랜잭션·안전한 partial receipt로 valid/bad/valid 및 실패 행 재처리를 지원한다.
  - kb_documents 이력과 기존 자료를 보존하고 current/nondeleted projection을 list_documents에 연결한다. legacy 여러 revision은
    문자열 정렬로 최신을 추정하지 않으며 모호한 head/owner는 보수적으로 제한한다. 선필터 검색·과거 result 무효화는 P1-001A이다.
  - P0-016 setup guard·원자적 migration·seed marker를 재사용한다. upsert_documents에 같은 revision overwrite 우회를 남기지
    않는다. 재개 보안 fixture는 정당한 새 revision/ACL 변경 또는 명시적인 test-only corruption으로 바꾸고 기대 보안 결과는 유지한다.
  - application SQLite DB/WAL/SHM은 최초 연결 전에 private mode와 symlink/비정규 파일 검사를 적용한다. checkpoint 보호를 KB 보호
    증거로 대신하지 않으며 기존 자료는 삭제하지 않는다.
  - migration4 등록에 맞춰 tests/test_teams.py의 migration 기대 목록만 [1,2,3,4]로 갱신한다. 기존 owner/team/runtime/권한
    검증을 줄이거나 변경하지 않는다.
  excluded:
  - 실제 connector/URL 수집, 외부 전송·게시, 실제 env 접근, worker graph/벡터 엔진
  - frozen 1.0 계약 변경, 권한 없는 legacy 자료의 현재 owner 임의 귀속
