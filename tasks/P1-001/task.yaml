title: 노트·export 입력과 revision 저장
objective: 텍스트/노트와 고정 GitHub issue·Confluence export fixture를 넣고 원문·출처를 유지한다. 기존 ID의 저장 책임 유지, 검색은 P1-001A로
  split.
