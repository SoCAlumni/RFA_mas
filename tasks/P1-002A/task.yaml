    host만 허용하고 follow_redirects=false, trust_env=false, stream=false.
  - 'AC1/AC3: 기본 모드 한국어 근거 질문 성공과 근거 부족 질문의 불확실 표시를 결정적 문자열 검사로 확인한다. AC2: json_object(thinking off) 응답의
