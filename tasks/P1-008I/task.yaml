acceptance_criteria:
- id: AC1
  given: owner의 active Task 팀과 다른 owner의 Task
  expect: 목록 API는 owner Task만 반환; 명시 task_id는 소유권 재검증 후 같은 task/team 재사용; 다른 owner/없는 ID는 거절
  required: true
- id: AC2
  given: 명시적 조사/검증 요청(task_run)과 이후 관련 질의
  expect: core team 경로로 새 Task 팀 1개 생성(팀 패턴은 core 선택); 같은 메시지 재전송 시 중복 생성 없음; 이후 관련 질의는 그 Task 팀으로 자동
    라우팅
  required: true
- id: AC3
  given: 단순 메모/질의
  expect: 자동 Task 생성 없음; 담당 없으면 비서 처리 유지; 기존 단계 스트림·CSRF·멱등성 회귀 통과
  required: true
- id: AC4
  given: 실제 브라우저
  expect: 드롭다운에 Task 팀이 우선 표시되고 선택/자동 모두 동작; JS 오류 없음
  required: true
