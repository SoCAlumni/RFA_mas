acceptance_criteria:
- id: AC1
  given: Langfuse로 내보낸 관측 metadata
  expect: 승인된 자체 삭제 job이 보존 기간이 지난 이 앱의 trace만 ID 기준으로 삭제하고 그 결과를 조회로 확인한다. 보존 기간 안의 trace와 다른 앱의 trace는
    삭제하지 않는다.
  required: true
- id: AC2
  given: egress 허가 없음, key 없음, 서버 오류, 삭제 미확인
  expect: 요청 0건 not_attempted 또는 failed/partial 고정 코드로 보고하며 삭제 성공으로 보고하지 않는다. 출력에 key·trace 본문이 없다.
  required: true
