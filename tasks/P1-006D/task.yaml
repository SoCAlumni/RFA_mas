acceptance_criteria:
- id: AC1
  given: 합성 Run과 승인 대기 재개/재시작, 일부 단계에는 1.0 원본 서비스 ID가 없음
  expect: 서버 mapping/단조 순번으로 같은 run을 연결하고 실제 발생한 참조만 기록한다. 원본에 없는 decision/approval/receipt는 null이며 로컬
    observation ID를 원본으로 표시하지 않는다. mode/provider/관측 출처를 구분한다.
  required: true
- id: AC2
  given: metadata·API validation/domain 오류·실패 RunResult·export에 prompt/본문/인자/첨부/identity/PII/key canary
    삽입 및 합성 ambient tracing flag
  expect: 안전한 typed allowlist만 저장하고 caller ID/사유/input/ctx/msg/임의 extra-key loc 반사로 canary가 우회하지 못한다.
    native run/resume에서 ambient flag가 실제 외부 raw tracer를 생성하지 않는다. 정상 owner correlation 및 frozen 1.0 wire
    schema는 유지하며 hash는 익명화가 아니다.
  required: true
- id: AC3
  given: 결정적 provider 성공/오류, token 없음, 연결되지 않은 ToolPort 및 별도 test sink 기록
  expect: 실제 관찰 경계의 순서/duration 단위/호출·실패를 run에 연결한다. 미수집·미실행은 0 성공이 아니며 provider token은 null이다. port 호출만으로
    실제 write를 주장하지 않고 sink 관측을 구분한다.
  required: true
- id: AC4
  given: 활성 local retention 설정과 legacy/외부 파일/symlink 및 오래된 승인 대기 run
  expect: 소유한 private product trace만 TTL 관리하고 다른 파일·개발 evidence는 건드리지 않는다. alias/순번 metadata는 trace TTL로
    지워지지 않는다. 외부 전송/새 backend는 활성화하지 않고 같은 안전한 export 계약을 후속 NAT가 소비한다.
  required: true
verification:
- id: V1
  ac_ids:
  - AC1
  - AC2
  - AC3
  - AC4
  type: command
  availability: planned
  prerequisites:
  - tests/test_trace_contract.py에 실제 경계 관측/재개 alias/순번/token-null/coverage/canary/sink와 private retention
    보호 검사를 추가한다.
  - 임시 DB·합성 fixture·명시 설정만 사용한다. 원본 secret/env/network 없음.
  - 합성 ambient tracing flag와 fake tracer/outbound spy로 native run/resume을 검증한다. guarded SDK constructor
    probe만으로 제품 실행 경로 성공을 대신하지 않는다.
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/test_trace_contract.py
  timeout_seconds: 120
  procedure: []
  assertions:
  - 재시작/재개에서 run alias와 단조 순번이 연결되고 없는 원본 stage ID는 null
  - 실제 API/service/legacy exporter canary와 임의 field/ID/사유 우회 차단
  - 임의 extra-key loc canary와 native graph의 환경변수 기반 raw 외부 tracing 차단, local allowlist recorder는 유지
  - 실제 호출·실패·duration/sink 출처, 미관측 coverage/token-null을 독립 기록
  - 제품 파일만 private/retention 처리하며 legacy·symlink·개발 evidence 및 run mapping은 보존
  runner: pytest
- id: V2
  ac_ids:
  - AC1
  - AC2
  - AC3
