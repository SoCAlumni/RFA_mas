schema_version: '1.0'
id: P1-006D
title: 안전한 trace allowlist·평가 관찰 계약 연결
objective: 기존 TracePort/LocalJsonlTrace를 확장하여 raw 본문 없이 실행·정책·근거·승인 참조와 실제 지연/호출을 연결한다.
kind: task
