- P1-006
- P0-009
requirement_refs:
- docs/EVALUATION_CONTEXT.md
priority: P0
status: done
spec_state: ready
unresolved: []
workstream: integration/evaluation
execution_role: coordinator
estimated_effort: 2.0
product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: local/mock; 제품 실행과 평가 도구의 실제 실행 여부를 별도 기록
scope:
  included:
  - 기존 TracePort/LocalJsonlTrace에 typed allowlist와 실제 port-boundary 관측을 연결한다. raw prompt/본문/인자/첨부/identity/인증
    header를 기록하지 않고 사용자 ID나 hash를 익명화로 취급하지 않는다.
  - 인증된 run 소유권 확인 후 기존 application SQLite에 서버 발급 alias와 원자적인 observation 순번을 저장하고 재개/재시작에서 재사용한다. 이 mapping은
    권한 원본이 아니며 trace 파일 TTL과 별개인 run metadata이다.
  - service의 실제 legacy emit도 안전한 recorder로 교체하고 자유 metadata 우회를 닫는다. ContextVar 관측 문맥은 항상 reset하며 composition의
    Model/Retrieval/Policy/Runtime/Response decorator에서 시작/종료/실패·monotonic duration을 수집한다. graph에 SDK/URL을
    넣지 않는다.
  - 기존 LangSmith0.14.0의 public tracing_context(enabled=False, parent=False) 또는 검증된 동등 경계를 native run/resume에
    적용해 ambient LANGSMITH_TRACING/LANGCHAIN_TRACING_V2만으로 외부 raw tracing이 활성화되지 않게 한다. 직접 import 시 이미
    lock된 langsmith 버전만 명시 dependency로 승격하며 새 backend/upgrade는 하지 않는다. 같은 프로세스 임의 악성 callback을 차단하는 sandbox라고
    주장하지 않는다.
  - 실제 port 호출과 테스트 sink의 실제 모의 write 수신은 별도 관측 출처다. 미연결 ToolPort/내부 노드는 uncollected, 현재 ModelResult에
    없는 provider token은 null이다. mock ToolPort write 금지를 해제하지 않는다.
  - 기존 1.0 Policy/Review에 없는 독립 decision/approval/receipt ID를 만들지 않는다. 로컬 observation ID는 해당 서비스 원본 ID가
    아니며 아직 없거나 제공되지 않은 stage ref는 null이다. provider/버전/역할은 신뢰된 registry 또는 안전한 alias만 사용한다.
  - API RfaError의 caller X-Request-Id 및 Pydantic input/ctx/msg와 attacker extra-key가 들어가는 loc 원문 반사를 제거한다.
    고정 안전 오류 코드/서버 correlation 또는 알려진 경로만 허용한다. 실패 RunResult의 caller request/trace/agent ID도 안전한 error
    projection으로 바꾸며 1.0 schema와 정상 owner 응답 correlation은 유지한다.
  - P0-017 planned TRACE_RETENTION_DAYS를 실제 LocalJsonlTrace 소비 설정으로 승격한다. private file·symlink 거절·명시적인
    소유 목록으로 제품 trace만 관리한다. 기존 legacy events.jsonl은 자동 export/삭제하지 않으며 .agent/evidence·source manifest·Git·타
    파일은 보존 대상 밖이다. 외부 backend는 계속 명시 unavailable이다.
  excluded:
  - 실제 팀원 승인/게시·OpenShell gateway·UI 구현, 외부 게시/배포, 실제 env 접근
  - 새 framework/관측 서버/profiler/메모리 엔진·core graph 재작성
  - frozen 1.0 계약 변경 또는 승인/권한 원본 중복 구현
