scope:
  included:
  - 기존 TracePort/LocalJsonlTrace를 확장하여 raw 본문 없이 실행·정책·근거·승인 참조와 실제 지연/호출을 연결한다.
  - 1.1 typed observation ledger를 신뢰된 실행/테스트 boundary에서 생성하고 coverage/미수집을 구분한다. P1-006 verifier는 이 계약을
    소비하며 모델의 성공 문구를 관찰로 신뢰하지 않는다.
  - legacy emit 경로도 typed allowlist로 제한한다. 사용자 입력 ID/사유는 안전한 서버 발급 ID와 분리하고 API error/trace export canary를
    검증한다. mock/local 원본과 평가용 test sink를 구분한다.
  - 실제 포트 decorator/신뢰된 recorder를 composition root에서 주입하여 순서·지연·호출·실패·coverage를 관찰한다. core graph에 SDK나
    URL을 넣지 않고 아직 연결되지 않은 ToolPort는 uncollected로 표시한다.
  - API 오류의 caller X-Request-Id/Pydantic input 반사를 제거한다. trace 식별자는 신뢰된 서버 mapping으로 연결하고 caller 문자열/해시를
    익명화로 취급하지 않는다. 원본 identity·인증 header·query/body·첨부는 trace에 저장하지 않는다.
  - P0-017 planned TRACE_RETENTION_DAYS를 실제 LocalJsonlTrace 소비 설정으로 승격한다. 소유한 trace 파일만 제한적으로 관리하고 타 파일/symlink는
    읽거나 삭제하지 않는다. 작업 관리 evidence/Git 로그는 제품 trace 보존 대상이 아니다. 외부 backend는 미구현 상태를 명시한다.
  excluded:
  - 실제 팀원 승인/게시·OpenShell gateway·UI 구현, 외부 게시/배포, 실제 .env 접근
  - 새 framework/관측 서버/메모리 엔진·core graph 재작성
  - 공통 DTO/설정/lock 임의 변경; coordinator 계약 변경 절차로 요청
