  - 활성 retention/example parity와 frozen/extended schema export 회귀를 포함한다.
  cwd: .
  argv:
  - .venv/bin/python
  - -m
  - pytest
  - -q
  - tests/test_security.py
  - tests/test_api.py
  - tests/test_settings.py
  - tests/test_sessions.py
  - tests/test_resume.py
  - tests/test_contracts.py
  - tests/test_contract_baseline.py
  - tests/test_trace_eval_contract.py
