product_owner: 민섭
execution_class: 이 저장소 구현
product_mode: 두 graph의 checkpointer 미주입 확인; 확장 missing/not_run. persistence local(false), model/review
  mock(true). 외부 의존 없음(설치 후 offline).
scope:
  included:
  - 기존 LangGraph/checkpoint와 호환되는 `langgraph-checkpoint-sqlite`를 resolver·공식 async API로 확인 후 exact pin.
    lifecycle에서 async SQLite saver 주입. 세션 thread·worker namespace와 안전한 resume 이벤트 계약; DB/KB는 별도 책임 유지.
  - 공식 sqlite3.1.1 async saver/explicit strict serializer/lifespan을 사용. Runtime.context로 현재 principal을
    주입하고 checkpoint metadata에는 서버 ID만 둠. Session root thread마다 하나의 미완료 Run; per-thread 동일-host lock은 프로세스
    종료 시 풀리며 local runtime sandbox 주장이 아님.
  - review 제출과 interrupt 대기를 분리. resume는 인증된 재조회 신호이며 ResponsePort 원본 결정의 ID/version/hash/target 및 현재
    source/policy를 재검사한다. approval bool 입력은 권한이 아님. 새 실행의 이전 draft/error 상태를 초기화.
  - fixture 초기 seed를 원자적인 한 번 동작으로 바꾸어 restart가 수정/삭제/권한회수를 덮어쓰지 않게 한다. 아직 최신 revision pointer가 없는 모호한
    근거는 fail closed.
  excluded:
  - 다른 task의 제품 기능·외부 게시/배포·실제 .env 접근
  - 공통 계약의 임의 변경; 필요한 변경은 coordinator가 계약 변경 절차로 관리
  - worker 실행 중 crash-window 부작용 exactly-once 및 모든 노드 복구 주장은 P0-021/P0-026에서 별도 검증; 승인 원본 재구현·실제 게시 금지
