acceptance_criteria:
- id: AC1
  given: 계약/공유 소스 변경으로 stale이 된, 활성 claim과 미통합 제출이 없는 integrated task가 새 task와 경로/자원이 겹침
  expect: 새 task claim은 그 stale 예약 때문에 거절되지 않는다. 단, 새 task의 depends_on이 stale이면 기존처럼 dependency로 거절되고,
    활성 claim·미통합 제출·blocked 예약은 계속 충돌로 거절된다.
  required: true
- id: AC2
  given: integrated revalidation claim 도중 다른 통합으로 target HEAD가 이동
  expect: worker 변경 없이 claim baseline의 후손인 현재 target HEAD로 clean fast-forward한 source는 무변경 revalidation으로
    제출할 수 있다. target과 다른 head, dirty tree, 소유 범위 밖 worker commit은 기존처럼 거절된다.
  required: true
- id: AC3
  given: 기존 taskctl/이관 회귀
  expect: fencing·evidence 불변성·scope·계약 수락·최종 gate(모든 통합 task 재검증) 규칙을 약화하지 않고 기존 테스트가 통과한다.
  required: true
