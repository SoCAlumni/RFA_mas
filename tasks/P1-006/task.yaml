  given: C01~C12·변형과 동일 질의의4 fixture identity, 기존24 ID
  expect: 기존 ID/요구를 보존하며 identity registry가 허용 source/audience를 결정한다. persona 사칭은 권한을 바꾸지 않는다. 가능한 native
