acceptance_criteria:
- id: AC1
  given: 같은 질의를 본인/같은 팀/다른 조직/외부 fixture identity로 실행; C01~C12
  expect: 허용 source/공유 범위가 다르고 persona의 팀장 주장은 권한을 바꾸지 않음. 기존 24 ID 보존, 새 12사례에 승인/갱신/충돌/중복/timeout 변형
    포함
  required: true
- id: AC2
  given: 정답이 좋아 보이는 결과 또는 높은 Judge 점수와 의도적으로 잘못된 outbound/write ledger
  expect: 허용 source/금지 tool/승인 전 write/중복 write/승인 payload 일치·egress를 결정적으로 검사; 위반 시 security gate 실패/runner
    nonzero, 정상 deny는 성공 기대값으로 검사
  required: true
- id: AC3
  given: Judge disabled/error/skip/근거 부족과 fake seed 고정
  expect: rule 결과는 독립 보존, semantic gate not_run/error이고 가짜 passed/점수 없음. fake 관찰 재현, 실제 LLM 문장 동일성 요구
    없음; quality는 근거성·유용성·요청 충족·표현·팀 선택 보조 평가
  required: true
- id: AC4
  given: 실행 결과 report/trace export와 외부 Judge opt-in 조건
  expect: case/scenario·evaluator/rubric·dataset/model/prompt/policy/source/code 버전과 실제 pass/fail/error/not_run·evidence
    ref 기록. 원문·private·secret 미수집, actual/simulated 구분; synthetic QA를 사용자 만족도로 부르지 않음. 외부 Judge는 허가된 합성/공개만
  required: true
