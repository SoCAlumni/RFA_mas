schema_version: '1.0'
id: P1-006
title: 핵심 12 Persona QA·행위 verifier·Judge 상태 분리
objective: 기존 평가 코드·fixture를 재사용해 권한·실제 mock 행동과 선택적 품질 평가를 독립 판정한다.
kind: task
source_tasks:
- P1-006
- P0-011
requirement_refs:
- docs/PRODUCT_REQUIREMENTS.md
- docs/archive/TASKS_2026-09-26.md
- docs/EVALUATION_CONTEXT.md
priority: P0
status: verifying
spec_state: ready
unresolved: []
workstream: integration/evaluation
execution_role: worker
estimated_effort: 2.0
product_owner: 민섭
execution_class: 본인 LLMOps
product_mode: 기존 evaluate_case/24 fixture 유지. 구현 예정인 native 합성 실행·관측 verifier는 local이며 MockJudge/test
  sink는 simulated이다. 평가기 검증과 12개 제품 시나리오 verdict를 분리한다. 미수집/미구현 조건은 unknown/not_run이며 실제 Judge·NAT·승인/게시·OpenShell
  검증이 아니다.
scope:
  included:
  - load_evaluation_cases/deterministic_rule_checks/evaluate_case와 기존24 ID를 호환 유지한다. EvaluationCaseV11/EvalResultV11/ObservationLedger/JudgePort를
    재사용하고 공통 DTO를 복제하거나 변경하지 않는다. evaluation.py 안의 작은 내부 fixture/관찰/report 모델은 기존 DTO를 감싸며 공개 계약 원본을 만들지
    않는다.
  - persona_core_v1.jsonl에 C01~C12, dataset/seed, identity_fixture_id, 기존 case ID crosswalk, 시나리오·변형·필수
    관찰을 정의한다. 같은 질의의 본인/프로젝트 동료/다른 조직/외부인을 신뢰된 fixture identity registry에 매핑한다. 외부인은 회사·membership 없는
    인증 fixture이며 persona 문자열이나 material_scope.memberships를 인증 근거로 사용하지 않는다.
  - 전용 임시 DB/checkpoint와 명시적 mock/local 설정에서 실제 WorkService.run/resume을 호출한다. service.observations.ledger(run_id,
    principal)의 immutable observation_id/sequence/coverage를 소비한다. JSONL line 수는 at-least-once export이므로
    호출/게시 횟수의 원본으로 사용하지 않는다. native request/result ID와 ledger alias가 다름을 존중하고 이미 권한 확인된 실행 handle로 연결한다.
  - 허용 source·금지 도구·outbound·승인 binding은 실제 경계에 설치한 in-process spy가 수신한 보호된 합성 요청/결과로 판정한다. 조회 결과나 trace
    문자열만으로 Model/Tool 전송 여부를 추정하지 않는다. raw 인자·본문·승인 payload는 검증 중 메모리에만 두고 보고서에는 판정·고정 사유·안전한 관찰 참조만 남긴다.
  - 실제 합성 sink 수신 후 observations.scope 안에서 record_test_sink(received=True)를 호출한다. origin=test_sink/provider_kind=test와
    보호된 receipt의 출처를 유지한다. 테스트 sink는 MockTool.write나 실제 Response publication을 활성화하지 않으며 승인 서비스/게시 엔진을
    새로 구현하지 않는다. 변조·위조한 음성 기록은 evaluator_negative_fixture provenance로 구분하고 native 실행 증거로 집계하지 않는다.
  - rule별 pass/fail/error/unknown/not_run 및 required 여부를 내부 report에 보존한다. 확인된 위반은 fail, 필수 증거 누락·coverage
    uncollected/incomplete는 unknown/error이다. EvalResultV11.rule_checks에는 실제 확인된 boolean만 넣으며 unknown을
    True로 대체하지 않는다. 필수 규칙 전체의 증거가 있어야 rule_status=pass이고 failure/unknown은 높은 Judge 점수로 상쇄하지 않는다.
  - C01~C07은 실제 source/identity 관찰과 기대 업무 결과를 검사하고 정상 deny는 기대 결과로 성공 판정할 수 있다. C08~C12의 미승인·정확한 binding·변경·권한회수·중복·timeout
    요구를 삭제하지 않는다. 현재 Tool/publish/internal_nodes는 uncollected이고 원본 approval/publication ID는 null이다. C06
    충돌 처리, C10 첨부, C11 cache/과거 결과 무효화 등 미구현 제품 조건은 unknown/not_run 또는 실제 관찰된 기능 실패로 보고한다. fixture verifier
    테스트 통과를 12개 제품 흐름 통과로 바꾸지 않는다.
  - 기존 evaluate_case의1.0 결과 의미를 유지하며 새 관찰 평가 경로는 Judge disabled/no-result/skip을 not_run, enabled call
    예외/invalid assessment를 error로 표현한다. EvalResultV11의 inherited 제약에 따라 judge_kind=not_run, executed=false,
    score/dimensions/adapter=null은 완료된 assessment 없음이고, 내부 report의 judge_attempted는 실제 호출 유무를 별도로 기록한다.
    규칙 결과는 보존한다. 기존 MockJudge의3개 차원만 실제 simulated score로 보고하고 표현/팀 선택 등 미지원 차원은 미검증이다.
  - 실제 Judge adapter는 이 task에서 활성화하지 않는다. 허용된 합성/공개 fixture 및 endpoint egress 승인 없는 외부 Judge 호출은 시작하지
    않는다. test double이 actual이라고 반환해도 보고서 provenance는 test_double이며 실제 LLM 또는 사용자 만족도 증거로 표시하지 않는다. 품질
    gate는 mock 점수만으로 verified가 되지 않는다.
  - planned CLI는 rfa evaluate --dataset persona-core-v1 --judge disabled|mock 이다. evaluation 분기는 일반 Settings()/dotenv
    생성 전에 처리하고 trusted init-only settings와 private TemporaryDirectory를 사용한다. 이 경로의 --env-file/실제 provider
    선택은 거절하며 기존 api/demo/doctor 명령 동작을 유지한다. stdout은 안전한 집계/report만 출력한다. 모든 required rule이 확인된 pass일
    때만 local-rule exit0, 관찰된 위반은1, 실행 오류/필수 증거 누락은2이다. exit0도 final product/semantic quality pass가 아니다.
  - report는 case/scenario/변형·identity fixture·dataset/seed·evaluator/rubric·code/policy/source 및 실제 사용한
    model/prompt 버전·관찰 참조·실행 모드·gate를 연결한다. 존재하지 않는 버전은 null/not_run으로 보존한다. 재현성은 고정 fake/seed의 판정·행동
    횟수·binding을 비교하며 random alias/실제 latency/timestamp 동일성을 요구하지 않는다.
  - '2026-09-27 재검증 보수: P1-005가 근거 로딩을 staged-context loader로 옮김에 따라 bootstrap이 그 경계를 container.context(StagedContextBoundary,
    late lookup)로 노출하고 BoundarySpy가 관측한다. 평가 규칙은 바꾸지 않는다.'
  excluded:
