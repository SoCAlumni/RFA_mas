# 검열 프로파일 선언 (설정 3개 중 3/3). censor.py 파이프라인이 읽는다.
# 검열은 egress 경계(호스트 egress-proxy: 외부 LLM 경로 요청·응답)와 /ask·개인 채팅의 최종 knowledge 에서
# 같은 함수(CensorPipeline.run)로 수행한다. 2단계: regex → LLM(censor 샌드박스, egress 0, 로컬 inference).
# 기본 동작 redact, 실패 시 fail-closed(block).
#
# 프로파일 ↔ 용도 (ask.yaml audiences 가 audience → profile 을 정한다):
#   external : egress-proxy 의 hosted 모델 경로(요청·응답)
#   public   : /ask audience=public (외부 게시 초안용 knowledge). external 규칙 + 미공개 일자 마스킹
#   internal : /ask audience=company·self (사내·개인 채팅). 자격증명 차단, canary·이메일만 마스킹
# LLM 단계에는 되먹임된 거절 사유(censor-rules/learned.yaml)가 hint 로 주입된다.
version: 1
default_action: redact
fail_closed: true

profiles:
  none:
    stages: []
  bypass:            # rfa-censor alias 전용. 프록시가 하드코딩으로 우회하므로 여기서는 참조만 한다.
    stages: []
  external:
    stages:
      - &external_regex
        id: regex
        type: regex
        rules:
          - id: canary
            pattern: 'SYNTHETIC_PRIVATE_CANARY_[A-Z0-9_]+'
            replacement: '[REDACTED:canary]'
          - id: internal-project
            keywords: [오로라, 네뷸라, TRIV-DEMO, 아틀라스, Zephyr]
            replacement: '[REDACTED:project]'
          - id: money-krw
            pattern: '\d{1,3}(?:,\d{3})+\s*(?:원|KRW)'
            replacement: '[REDACTED:amount]'
          - id: percent-metric
            pattern: '\d+(?:\.\d+)?\s*%'
            replacement: '[REDACTED:metric]'
          - id: latency-ms
            pattern: '\d{1,3}(?:,\d{3})*(?:\.\d+)?\s*ms\b'
            replacement: '[REDACTED:metric]'
          - id: email
            pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
            replacement: '[REDACTED:email]'
          - id: credential
            pattern: '(?i)\b(?:bearer|nvapi-|sk-)[A-Za-z0-9._-]{12,}'   # \b: 세션 id ask-… 의 sk- 는 자격증명이 아니다 (2026-09-28 실측 오탐)
            replacement: '[REDACTED:credential]'
            action: block            # 자격증명이 보이면 redact 가 아니라 전송 자체를 막는다
          - id: citation-id          # 지식 응답의 근거 인용 id(32자 hex)를 LLM 판정 전에 지운다: 판정 모델이 자격증명으로 오인해 block (2026-09-28 실측)
            pattern: '\[source_[0-9a-f]{16,}\]'
            replacement: '[source]'
      - &external_llm
        id: llm
        type: llm
        # runner: direct = 프록시가 rfa-censor alias(hosted build.nvidia.com)로 분류 프롬프트만 전송.
        #         sandbox-agent = censor 에이전트(기본 샌드박스)의 OpenClaw 턴. 긴 시스템 프롬프트를 매 턴 처리해
        #         느리다 → timeout 초과 위험. 기본은 direct (WORK_LOG 참고).
        runner: direct
        sandbox: rfa-main            # censor 에이전트가 배치된 샌드박스 (기본 샌드박스; 별도 샌드박스 없음)
        agent: censor
        alias: rfa-censor
        timeout_seconds: 12          # hosted 판정 실측 1~9초, 약 1/4 은 응답 없이 멈춤 → 짧게 끊고 1회 재시도(serve.DirectJudge)
        skip_if_shorter_than: 24     # 아주 짧은 텍스트는 regex 단계만
        categories: [internal_project, financial_figure, personal_data, credential]
        on_error: allow              # 판정 provider 가 두 번 다 응답하지 않으면 그 텍스트는 regex 결과로 통과(감사에 degraded 기록). 2026-09-27 사용자 결정
  public:                                  # /ask audience=public: external 규칙 + 미공개 일자
    stages:
      - *external_regex
      - id: regex-public
        type: regex
        rules:
          - id: date
            pattern: '20\d\d-\d\d-\d\d'
            replacement: '[REDACTED:date]'
      - *external_llm
  internal:                                # /ask audience=company·self: 사내 독자. 자격증명은 차단, 개인정보·canary 마스킹
    stages:
      - id: regex
        type: regex
        rules:
          - id: canary
            pattern: 'SYNTHETIC_PRIVATE_CANARY_[A-Z0-9_]+'
            replacement: '[REDACTED:canary]'
          - id: email
            pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
            replacement: '[REDACTED:email]'
          - id: credential
            pattern: '(?i)\b(?:bearer|nvapi-|sk-)[A-Za-z0-9._-]{12,}'   # \b: 세션 id ask-… 의 sk- 는 자격증명이 아니다 (2026-09-28 실측 오탐)
            replacement: '[REDACTED:credential]'
            action: block
