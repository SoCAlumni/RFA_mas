# /ask(지식 서버) 선언. entry(127.0.0.1:8799)가 FastAPI 로 서빙하고 `ask()` 한 함수가 head → broker → task → censor 를 수행한다.
# 계약: docs/api/ask.openapi.yaml (생성물, scripts/export_openapi.py ask). 인증: Bearer RFA_ASK_TOKEN (.env.dev, 0600).
version: 1

auth:
  credential_env: RFA_ASK_TOKEN
  env_file: .env.dev

# audience 가 검열 프로파일(censors.yaml)과 샌드박스 inference 라우팅 채널(routing.yaml channels)을 정하는 유일한 분기점.
audiences:
  public:  { profile: public,   channel: external }   # 외부 게시 초안용. hosted 모델 허용(프록시 검열) + 최종 knowledge public 검열
  company: { profile: internal, channel: internal }   # 사내 독자. internal 채널(검열 없음)
  self:    { profile: internal, channel: internal }   # 개인 채팅(CLI/웹). internal 채널(검열 없음)

server:                      # /ask 는 동기. admission queue(202 경로) 는 legacy/ 로 이동(2026-09-27)
  timeout_seconds: 180       # 서버 측 처리 타임아웃. 초과 시 refusal no_knowledge + "timeout"
  result_ttl_seconds: 3600   # request_id 멱등 캐시 보존 시간

lineage:
  max_rejections: 3          # 같은 계보(request_id prefix 또는 target)에서 거절 3회 → refusal blocked_by_policy

head:
  runner: direct             # direct: egress-proxy(internal 채널, hosted 모델)로 라우팅 JSON 만 요청 | fake: 키워드 규칙
  timeout_seconds: 60
  fallback: keywords         # LLM 출력이 JSON 이 아니거나 카탈로그 밖이면 키워드 규칙으로 폴백(감사 기록 head=fallback)

# 지식 카탈로그: head 가 고를 수 있는 task 와 담당 task 에이전트(assignments.yaml agents). id 는 knowledge facade 의 task id.
tasks:
  - id: triv3
    name: TRIV3 벤치마크 (오로라)
    agent: research
    keywords: [오로라, TRIV3, TRIV, 벤치마크, 지연, 정확도, 예산, 마감, 대시보드, 절차]
  - id: quantization_research
    name: Quantization Research (네뷸라)
    agent: research
    keywords: [네뷸라, 양자화, INT4, INT8, Zephyr, perplexity, 논문]

learned_rules_file: deploy/nemoclaw/censor-rules/learned.yaml   # 되먹임된 거절 사유(호스트 파일, 요청 본문으로 censor 에 전달)
