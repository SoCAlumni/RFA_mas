# 보안 그룹 배치 선언 (설정 3개 중 1/3). 컨트롤러 `python -m rfa_mas.nemoclaw` 가 이 파일을 읽어
# NemoClaw CLI(onboard --agents / policy add|remove|exclude / agents apply / mcp add / policy explain)로
# 샌드박스 상태를 reconcile 한다. `openshell policy set` 은 사용하지 않는다.
#
# 원칙: 샌드박스 = 보안 그룹 조합 단위. task 에이전트는 자신의 groups 집합과 같은 groups 를 가진
# (fixed 가 아닌) 샌드박스에 배치된다. assistant/censor 는 고정 샌드박스를 단독 사용한다.
version: 1

host:
  lan_ip: 192.168.123.191                 # 샌드박스 → 호스트 REST/MCP 목적지 (OpenShell preset host)
  sandbox_host_alias: host.openshell.internal   # 샌드박스 → egress-proxy inference route 목적지
  nemoclaw_bin: nemoclaw                  # PATH 에 ~/.hermes/node/bin 을 포함해 실행 (Makefile 참고)

# 모든 샌드박스에서 제거하는 baseline 항목: 외부로 직접 나가는 경로를 OpenShell 층에서 끊는다.
# (managed_inference, openclaw_gateway_dialback 은 제거 불가/필수라 유지)
baseline_excludes: [nvidia, clawhub, openclaw_api, openclaw_docs, npm_registry]

security_groups:
  egress-none:
    description: 외부 egress 0. managed inference(egress-proxy) 외 목적지 없음.
    privilege: 0
    presets: []
  intranet-ro:
    description: 사내 지식 API(knowledge facade) 읽기 전용. GET /tasks, POST /tasks/*/ask.
    privilege: 1
    presets: [sg-intranet-ro]
  control-plane:
    description: assistant 전용. 브로커 MCP(managed) 또는 REST 폴백 preset.
    privilege: 2
    presets: []
    mcp_servers: [broker]
    fallback_presets: [sg-control-plane]   # managed MCP 등록이 불가능할 때만 적용

sandboxes:
  rfa-censor:         { groups: [egress-none], fixed: true }
  rfa-tasks-none:     { groups: [egress-none] }
  rfa-tasks-intranet: { groups: [intranet-ro] }
  rfa-assistant:      { groups: [control-plane], fixed: true }

# 온보딩 순서: 검열/무egress 샌드박스가 먼저 서야 시나리오 01 을 가장 빨리 확인할 수 있다.
onboarding_order: [rfa-censor, rfa-tasks-none, rfa-tasks-intranet, rfa-assistant]

# alias 는 routing.yaml 의 논리 모델 alias. 채널이 internal 이면 항상 rfa-internal 로 강등된다.
agents:
  censor:
    kind: fixed
    sandbox: rfa-censor
    alias: rfa-censor
    skill: censor
    description: egress 0 샌드박스에서 텍스트를 JSON 으로 분류만 하는 검열 LLM 단계.
    tools: { profile: minimal, allow: [read] }
  assistant:
    kind: fixed
    sandbox: rfa-assistant
    alias: rfa-external
    skill: sg-assistant
    description: 비서. 브로커 MCP 의 ask_task_agent 로만 task 에이전트에 위임한다.
    tools: { profile: minimal, allow: [read, sessions_spawn] }
  research:
    kind: task
    groups: [intranet-ro]
    alias: rfa-external
    skill: task-research
    description: 사내 지식 API 에서 근거를 찾아 요약하는 조사 담당.
    tools: { allow: [read, exec] }
  benchmark:
    kind: task
    groups: [intranet-ro]
    alias: rfa-internal
    skill: task-benchmark
    description: 벤치마크 수치를 사내 API 에서 조회해 로컬 모델로만 답하는 담당.
    tools: { allow: [read, exec] }
  summarizer:
    kind: task
    groups: [egress-none]
    alias: rfa-external
    skill: task-summarizer
    description: 전달받은 텍스트만 요약한다. 네트워크 도구 없음.
    tools: { allow: [read] }
