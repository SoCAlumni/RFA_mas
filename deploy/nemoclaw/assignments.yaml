# 보안 그룹 배치 선언 (설정 3개 중 1/3). 컨트롤러 `python -m rfa_mas.nemoclaw` 가 이 파일을 읽어
# NemoClaw CLI(onboard --agents / policy add|remove|exclude / agents apply / mcp add / policy explain)로
# 샌드박스 상태를 reconcile 한다. `openshell policy set` 은 사용하지 않는다.
#
# 배치 원칙:
#   - 기본 샌드박스는 하나(default: true). 모든 에이전트는 기본적으로 여기에 배치된다.
#   - 추가 샌드박스는 선택이다. 에이전트에 `sandbox: <이름>` 을 명시해야만 그 샌드박스가 온보딩되고 배치된다.
#   - 샌드박스는 여전히 보안 그룹의 조합 단위다. 에이전트의 `groups`(필요한 egress)는 배치되는 샌드박스가
#     모두 제공해야 한다(부분집합 검증). 경계를 넘으면 안 되는 규칙은 OpenShell preset 층에 있다.
version: 1

host:
  lan_ip: 192.168.0.5                 # 샌드박스 → 호스트 REST/MCP 목적지 (OpenShell preset host)
  sandbox_host_alias: host.openshell.internal   # 샌드박스 → egress-proxy inference route 목적지
  nemoclaw_bin: nemoclaw                  # PATH 에 ~/.hermes/node/bin 을 포함해 실행 (Makefile 참고)

# 모든 샌드박스에서 제거하는 baseline 항목: 외부로 직접 나가는 경로를 OpenShell 층에서 끊는다.
# (managed_inference, openclaw_gateway_dialback 은 제거 불가/필수라 유지)
baseline_excludes: [nvidia, clawhub, openclaw_api, openclaw_docs, npm_registry]

security_groups:
  egress-none:
    description: 외부 egress 0. managed inference(egress-proxy) 외 목적지 없음.
    privilege: 0
    presets: []
  intranet-ro:
    description: 사내 지식 API(knowledge facade) 읽기 전용. GET /tasks, POST /tasks/*/ask.
    privilege: 1
    presets: [sg-intranet-ro]
  control-plane:
    description: assistant 전용. 브로커 MCP(managed) 또는 REST 폴백 preset.
    privilege: 2
    presets: []
    mcp_servers: [broker]
    fallback_presets: [sg-control-plane]   # managed MCP 등록이 불가능할 때만 적용

sandboxes:
  rfa-main:        { groups: [control-plane, intranet-ro], default: true }   # 기본: assistant(main) + censor + 모든 task 에이전트
  rfa-tasks-none:  { groups: [egress-none] }                                # 선택: egress 0 격리가 필요한 에이전트가 `sandbox:` 로 옮겨올 때만 온보딩

# 온보딩 순서(선언된 샌드박스 전부 나열; 배치된 에이전트가 없는 선택 샌드박스는 건너뛴다).
onboarding_order: [rfa-main, rfa-tasks-none]

# tools: OpenClaw 도구 정책. 관측(2026-09-27, OpenClaw 2026.7.1 관리 이미지): `profile: minimal` 은 allow 에 적은 도구까지
#        제거한다("tool policy removed 25 tool(s) via tools.profile (minimal): read, sessions_spawn, …"). 그래서 profile: coding
#        을 기반으로 deny(그룹·도구 id) 로 좁힌다. 진행형 도구 노출(tool_search)도 allowlist 와 충돌해 온보딩은 --tool-disclosure direct.
# alias 는 routing.yaml 의 논리 모델 alias. 채널이 internal 이면 항상 rfa-internal 로 강등된다.
# groups 는 "필요한 egress" 선언이다(빈 목록 = 네트워크 불필요). 다른 샌드박스로 격리하려면 `sandbox:` 를 추가한다.
agents:
  assistant:
    kind: fixed
    sandbox: rfa-main
    groups: [control-plane]
    alias: rfa-external
    skill: sg-assistant
    description: 비서. 브로커 MCP 의 ask_task_agent 또는 같은 샌드박스 sessions_spawn 으로 task 에이전트에 위임한다.
    # coding 프로파일(fs·runtime·sessions·web 등 + 구성된 MCP 서버 도구 bundle-mcp)에서 위험 도구를 deny 로 제거한다.
    # deny process/code_execution, not group:runtime: sessions_spawn children inherit the requester's denylist, and
    # research/benchmark need exec (curl) — see roles.yaml supervisor.
    tools: { profile: coding, deny: [process, code_execution, write, edit, apply_patch, group:web, cron, group:memory, group:media, skill_workshop, browser] }
  censor:
    kind: task
    groups: []
    delegatable: false
    alias: rfa-censor
    skill: censor
    description: 텍스트를 JSON 으로 분류만 하는 검열 LLM 단계 (브로커 위임 대상 아님, 네트워크 도구 없음).
    tools: { profile: coding, deny: [group:runtime, write, edit, apply_patch, group:sessions, group:web, cron, group:memory, group:media, skill_workshop, browser, bundle-mcp] }
  research:
    kind: task
    groups: [intranet-ro]
    alias: rfa-external
    skill: task-research
    description: 사내 지식 API 에서 근거를 찾아 요약하는 조사 담당.
    tools: { profile: coding, deny: [write, edit, apply_patch, process, code_execution, group:sessions, group:web, cron, group:memory, group:media, skill_workshop, browser, bundle-mcp] }
  benchmark:
    kind: task
    groups: [intranet-ro]
    alias: rfa-internal
    skill: task-benchmark
    description: 벤치마크 수치를 사내 API 에서 조회해 답하는 담당.
    tools: { profile: coding, deny: [write, edit, apply_patch, process, code_execution, group:sessions, group:web, cron, group:memory, group:media, skill_workshop, browser, bundle-mcp] }
  summarizer:
    kind: task
    groups: []
    alias: rfa-external
    skill: task-summarizer
    description: "전달받은 텍스트만 요약한다. 네트워크 도구 없음. (격리 예: sandbox 를 rfa-tasks-none 으로 지정)"
    tools: { profile: coding, deny: [group:runtime, write, edit, apply_patch, group:sessions, group:web, cron, group:memory, group:media, skill_workshop, browser, bundle-mcp] }
