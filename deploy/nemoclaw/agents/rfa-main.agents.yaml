# Generated by `python -m rfa_mas.nemoclaw render` from deploy/nemoclaw/assignments.yaml.
# Applied with `nemoclaw onboard --agents` (bake) or `nemoclaw <sb> agents apply -f` (live).
defaults:
  subagents:
    maxSpawnDepth: 2
main:
  tools:
    profile: coding
    deny:
    - process
    - code_execution
    - write
    - edit
    - apply_patch
    - group:web
    - cron
    - group:memory
    - group:media
    - skill_workshop
    - browser
  subagents:
    requireAgentId: true
    allowAgents:
    - agent-ops
    - benchmark
    - infer-opt
    - npu-sdk
    - ondevice-train
    - research
    - summarizer
    delegationMode: prefer
agents:
- id: agent-ops
  description: '[사내 Agent 자동화 구축] task 대표(supervisor): 멤버 research, verifier 를 부려
    답하고 verifier 로 검증한다.'
  model: inference/rfa-internal
  tools:
    profile: coding
    deny:
    - process
    - code_execution
    - write
    - edit
    - apply_patch
    - group:web
    - cron
    - group:memory
    - group:media
    - skill_workshop
    - browser
    - bundle-mcp
  subagents:
    requireAgentId: true
    allowAgents:
    - t-automation-research
    - t-automation-verifier
    delegationMode: prefer
- id: benchmark
  description: 벤치마크 수치를 사내 API 에서 조회해 답하는 담당.
  model: inference/rfa-internal
  tools:
    profile: coding
    deny:
    - write
    - edit
    - apply_patch
    - process
    - code_execution
    - group:sessions
    - group:web
    - cron
    - group:memory
    - group:media
    - skill_workshop
    - browser
    - bundle-mcp
  subagents:
    requireAgentId: true
- id: censor
  description: 텍스트를 JSON 으로 분류만 하는 검열 LLM 단계 (브로커 위임 대상 아님, 네트워크 도구 없음).
  model: inference/rfa-censor
  tools:
    profile: coding
    deny:
    - group:runtime
    - write
    - edit
    - apply_patch
    - group:sessions
    - group:web
    - cron
    - group:memory
    - group:media
    - skill_workshop
    - browser
    - bundle-mcp
  subagents:
    requireAgentId: true
- id: infer-opt
  description: '[Inference 최적화 연구] task 대표(supervisor): 멤버 research, benchmark, verifier
    를 부려 답하고 verifier 로 검증한다.'
  model: inference/rfa-internal
  tools:
    profile: coding
    deny:
    - process
    - code_execution
    - write
    - edit
    - apply_patch
    - group:web
    - cron
    - group:memory
    - group:media
    - skill_workshop
    - browser
    - bundle-mcp
  subagents:
    requireAgentId: true
    allowAgents:
    - t-inference-research
    - t-inference-benchmark
    - t-inference-verifier
    delegationMode: prefer
- id: npu-sdk
  description: '[NPU Compiler SDK] task 대표(supervisor): 멤버 research, summarizer, verifier
