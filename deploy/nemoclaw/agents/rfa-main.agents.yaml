# Generated by `python -m rfa_mas.nemoclaw render` from deploy/nemoclaw/assignments.yaml.
# Applied with `nemoclaw onboard --agents` (bake) or `nemoclaw <sb> agents apply -f` (live).
defaults:
  subagents:
    maxSpawnDepth: 1
main:
  tools:
    profile: minimal
    allow:
    - read
    - sessions_spawn
  subagents:
    requireAgentId: true
    allowAgents:
    - benchmark
    - research
    - summarizer
    delegationMode: prefer
agents:
- id: benchmark
  description: 벤치마크 수치를 사내 API 에서 조회해 로컬 모델로만 답하는 담당.
  model: inference/rfa-internal
  tools:
    allow:
    - read
    - exec
  subagents:
    requireAgentId: true
- id: censor
  description: 텍스트를 JSON 으로 분류만 하는 검열 LLM 단계 (브로커 위임 대상 아님, 네트워크 도구 없음).
  model: inference/rfa-censor
  tools:
    profile: minimal
    allow:
    - read
  subagents:
    requireAgentId: true
- id: research
  description: 사내 지식 API 에서 근거를 찾아 요약하는 조사 담당.
  model: inference/rfa-external
  tools:
    allow:
    - read
    - exec
  subagents:
    requireAgentId: true
- id: summarizer
  description: '전달받은 텍스트만 요약한다. 네트워크 도구 없음. (격리 예: sandbox 를 rfa-tasks-none 으로 지정)'
  model: inference/rfa-external
  tools:
    allow:
    - read
  subagents:
    requireAgentId: true
