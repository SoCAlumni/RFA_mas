# Generated by `python -m rfa_mas.nemoclaw render` from deploy/nemoclaw/assignments.yaml.
# Applied with `nemoclaw onboard --agents` (bake) or `nemoclaw <sb> agents apply -f` (live).
defaults:
  subagents:
    maxSpawnDepth: 2
main:
  tools:
    profile: coding
    deny:
    - group:runtime
    - write
    - edit
    - apply_patch
    - group:web
    - cron
    - group:memory
    - group:media
    - skill_workshop
    - browser
    - bundle-mcp
  subagents:
    requireAgentId: true
