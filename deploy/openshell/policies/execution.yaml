# E2E-05 execution role (experiment_runner stand-in). No network rules, so OpenShell
# adds no baseline paths: the approved workdir (/sandbox) is the only writable path.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /bin, /etc, /proc, /dev/urandom]
  read_write: [/dev/null]
landlock:
  compatibility: hard_requirement
