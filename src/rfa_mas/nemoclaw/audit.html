<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFA Security Groups — 감사 로그</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ee; --muted:#9aa3b2;
          --allow:#3fb950; --redact:#d29922; --block:#f85149; --denied:#f85149; --approved:#58a6ff; --info:#8b949e; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, "Pretendard", "Noto Sans KR", sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:18px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .mode { color:var(--muted); }
  .grid { display:grid; grid-template-columns: 300px 1fr; gap:14px; padding:14px 18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .panel h2 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--panel); }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
  .v-allow { color:var(--allow); border-color:var(--allow); }
  .v-redact { color:var(--redact); border-color:var(--redact); }
  .v-block, .v-denied, .v-refused, .v-error, .v-timeout { color:var(--block); border-color:var(--block); }
  .v-approved, .v-ok, .v-drained { color:var(--approved); border-color:var(--approved); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  select, input, button { background:#0f1115; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:13px; }
  .detail { color:var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; white-space:pre-wrap; }
  .counts div { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line); }
  .small { color:var(--muted); font-size:12px; }
  .runner { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .runner textarea { width:100%; min-height:72px; resize:vertical; font:13px/1.4 inherit; }
  .runner .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .runner .result { border:1px dashed var(--line); border-radius:6px; padding:8px; min-height:72px; }
  .runner .reply { white-space:pre-wrap; margin:6px 0; }
  .runner .expect { color:var(--muted); font-size:12px; }
  .runner select { max-width:100%; }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; cursor:pointer; }
  button.primary[disabled] { opacity:.5; cursor:wait; }
  .unavail { color:var(--block); font-size:12px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .runner { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>RFA Security Groups — 감사 로그</h1>
  <span class="mode" id="mode">route mode: …</span>
  <span class="small">채널 · 검열 프로파일 · 에이전트 · verdict · OpenShell 정책 차단 · 승인 이력을 한 화면에</span>
</header>
<div class="grid">
  <aside>
    <div class="panel">
      <h2>집계 (kind / verdict)</h2>
      <div class="counts" id="counts"></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2>채널 → alias → 검열</h2>
      <table id="channels"></table>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2>에이전트 배치</h2>
      <table id="agents"></table>
    </div>
  </aside>
  <main class="panel">
    <h2>테스트 실행 — 샘플 질문을 채널·대상에 바로 보낸다 (모든 hop 이 아래 감사 로그에 남는다)</h2>
    <div class="runner">
      <div>
        <div class="row">
          <label>채널 <select id="run-channel"><option value="internal">internal (로컬, 검열 없음)</option><option value="external">external (hosted, 검열)</option></select></label>
          <label>대상 <select id="run-target"></select></label>
        </div>
        <div class="row" style="margin-top:6px">
          <select id="run-sample" style="flex:1"><option value="">샘플 질문 선택…</option></select>
        </div>
        <textarea id="run-text" placeholder="질문을 입력하거나 샘플을 선택"></textarea>
        <div class="row">
          <button class="primary" id="run-btn">실행</button>
          <span class="small" id="run-status"></span>
        </div>
        <div class="expect" id="run-expect"></div>
        <div class="unavail" id="run-unavail"></div>
      </div>
      <div class="result" id="run-result"><span class="small">결과가 여기에 표시된다: 응답, verdict, 마스킹 수, alias/백엔드, 소요 시간.</span></div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <div class="filters">
      <select id="kind">
        <option value="">모든 종류</option>
        <option value="channel">channel (진입 API)</option>
        <option value="inference">inference (egress-proxy)</option>
        <option value="broker">broker</option>
        <option value="censor">censor</option>
        <option value="policy">policy (컨트롤러)</option>
        <option value="request">request (OpenShell 차단)</option>
        <option value="approval">approval (승인/거부)</option>
        <option value="relocation">relocation (재배치)</option>
      </select>
      <input id="session" placeholder="session_id 필터">
      <button id="refresh">새로고침</button>
      <label class="small"><input type="checkbox" id="auto" checked> 5초 자동</label>
    </div>
    <table>
      <thead><tr><th>시각</th><th>종류</th><th>채널</th><th>프로파일</th><th>샌드박스 / 에이전트</th><th>verdict</th><th>action</th><th>세부</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (ts) => new Date(ts * 1000).toLocaleTimeString("ko-KR", {hour12:false});
async function load() {
  const kind = $("#kind").value, session = $("#session").value.trim();
  const q = new URLSearchParams({limit: "300"}); if (kind) q.set("kind", kind); if (session) q.set("session_id", session);
  const [ev, sum] = await Promise.all([fetch("/audit/api/events?" + q).then(r => r.json()), fetch("/audit/api/summary").then(r => r.json())]);
  $("#mode").textContent = "route mode: " + sum.mode;
  $("#rows").innerHTML = ev.events.map(e => {
    const d = e.detail || {};
    const bits = [];
    if (d.alias) bits.push("alias=" + d.alias);
    if (d.reason) bits.push("reason=" + d.reason);
    if (d.request_redactions !== undefined) bits.push("req_redact=" + d.request_redactions);
    if (d.response_redactions !== undefined) bits.push("resp_redact=" + d.response_redactions);
    if (d.redactions && Object.keys(d.redactions).length) bits.push("redactions=" + JSON.stringify(d.redactions));
    if (d.blocked_by) bits.push("blocked_by=" + d.blocked_by);
    if (d.tampered_markers) bits.push("tampered_markers=" + d.tampered_markers);
    if (d.route) bits.push("route=" + d.route);
    if (d.host) bits.push("host=" + d.host + (d.port ? ":" + d.port : ""));
    if (d.path) bits.push(d.method + " " + d.path);
    if (d.policy) bits.push("policy=" + d.policy);
    if (d.preset) bits.push("preset=" + d.preset);
    if (d.from_sandbox) bits.push(d.from_sandbox + " → " + d.to_sandbox + " (" + d.direction + ")");
    if (d.ms !== undefined) bits.push(d.ms + "ms");
    if (d.error) bits.push("error=" + d.error);
    return `<tr><td>${fmt(e.ts)}</td><td>${esc(e.kind)}</td><td>${esc(e.channel ?? "")}</td><td>${esc(e.profile ?? "")}</td>` +
      `<td>${esc(e.sandbox ?? "")}${e.agent ? " / " + esc(e.agent) : ""}</td>` +
      `<td><span class="tag v-${esc(e.verdict)}">${esc(e.verdict ?? "")}</span></td><td>${esc(e.action ?? "")}</td>` +
      `<td class="detail">${esc(bits.join("  "))}${e.session_id ? "\nsid=" + esc(e.session_id) : ""}</td></tr>`;
  }).join("") || `<tr><td colspan="8" class="small">이벤트 없음</td></tr>`;
  $("#counts").innerHTML = Object.entries(sum.counts).map(([k, v]) =>
    Object.entries(v).map(([verdict, n]) => `<div><span>${esc(k)} · <span class="tag v-${esc(verdict)}">${esc(verdict)}</span></span><b>${n}</b></div>`).join("")).join("") || `<div class="small">없음</div>`;
  $("#channels").innerHTML = Object.entries(sum.channels).map(([c, v]) => {
    const a = sum.aliases[v.alias] || {};
    return `<tr><td>${esc(c)}</td><td>${esc(v.alias)}</td><td>${esc(a.backend)} · ${esc(a.model)}</td><td>${esc(v.profile)}</td></tr>`;
  }).join("");
  $("#agents").innerHTML = sum.agents.map(a =>
    `<tr><td>${esc(a.agent)}${a.draining ? ' <span class="tag v-redact">draining</span>' : ""}</td><td>${esc(a.sandbox)}</td><td class="small">${esc((a.groups || []).join(","))}</td><td class="small">${esc(a.alias)}</td></tr>`).join("");
}
let SAMPLES = [], TARGETS = [], SANDBOXES = null;
async function loadRunner() {
  const [sm, sb] = await Promise.all([fetch("/audit/api/samples").then(r => r.json()), fetch("/audit/api/sandboxes").then(r => r.json()).catch(() => null)]);
  SAMPLES = sm.samples; TARGETS = sm.targets; SANDBOXES = sb ? sb.sandboxes : null;
  $("#run-target").innerHTML = TARGETS.map(t => `<option value="${esc(t.id)}">${esc(t.label)}</option>`).join("");
  $("#run-sample").innerHTML = `<option value="">샘플 질문 선택…</option>` + SAMPLES.map(s => `<option value="${esc(s.id)}">${esc(s.title)}</option>`).join("");
  updateAvail();
}
function updateAvail() {
  const t = TARGETS.find(x => x.id === $("#run-target").value);
  if (!t || !SANDBOXES) { $("#run-unavail").textContent = ""; return; }
  $("#run-unavail").textContent = (t.sandbox && !SANDBOXES.includes(t.sandbox)) ? `샌드박스 ${t.sandbox} 가 아직 없다 (make bootstrap 필요)` : "";
}
$("#run-sample").onchange = () => {
  const s = SAMPLES.find(x => x.id === $("#run-sample").value); if (!s) return;
  $("#run-text").value = s.text; $("#run-channel").value = s.channel; $("#run-target").value = s.target;
  $("#run-expect").textContent = s.expect ? "기대: " + s.expect : ""; updateAvail();
};
$("#run-target").onchange = updateAvail;
$("#run-btn").onclick = async () => {
  const text = $("#run-text").value.trim(); if (!text) return;
  const btn = $("#run-btn"); btn.disabled = true; const t0 = Date.now();
  $("#run-status").textContent = "실행 중…"; $("#run-result").innerHTML = `<span class="small">대기 중 (로컬 모델 턴은 수십 초, hosted 턴은 최대 90초)</span>`;
  const tick = setInterval(() => { $("#run-status").textContent = `실행 중… ${((Date.now() - t0) / 1000).toFixed(0)}s`; }, 1000);
  try {
    const r = await fetch("/audit/api/run", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, channel: $("#run-channel").value, target: $("#run-target").value, sample_id: $("#run-sample").value || undefined }) });
    const d = await r.json();
    const red = d.redactions ? JSON.stringify(d.redactions) : "-";
    $("#run-result").innerHTML =
      `<div class="row"><span class="tag v-${esc(d.verdict || (r.ok ? "ok" : "error"))}">${esc(d.verdict || (r.ok ? "ok" : "error"))}</span>` +
      `<span class="small">HTTP ${r.status} · ${esc(d.channel || "")}/${esc(d.profile || "")} · target=${esc(d.target || "")}` +
      `${d.alias ? " · alias=" + esc(d.alias) : ""}${d.backend ? " · " + esc(d.backend) : ""}${d.sandbox ? " · " + esc(d.sandbox) : ""}${d.route ? " · " + esc(d.route) : ""} · ${d.ms ?? "?"}ms · 마스킹 ${esc(red)}${d.blocked_by ? " · blocked_by=" + esc(d.blocked_by) : ""}</span></div>` +
      `<div class="reply">${esc(d.reply || d.error || d.code || JSON.stringify(d).slice(0, 400))}</div>` +
      (d.censor && d.censor.stages ? `<div class="small">censor stages: ${esc(d.censor.stages.map(s => `${s.id}=${s.verdict}(${s.ms}ms)`).join(", "))}</div>` : "");
    $("#run-status").textContent = r.ok ? `완료 ${((Date.now() - t0) / 1000).toFixed(1)}s` : `실패 ${((Date.now() - t0) / 1000).toFixed(1)}s`;
  } catch (e) { $("#run-status").textContent = "오류: " + e; }
  finally { clearInterval(tick); btn.disabled = false; load(); }
};
loadRunner();
$("#refresh").onclick = load; $("#kind").onchange = load; $("#session").onchange = load;
setInterval(() => { if ($("#auto").checked) load(); }, 5000);
load();
</script>
</body>
</html>
