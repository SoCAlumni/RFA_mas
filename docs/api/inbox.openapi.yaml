openapi: 3.1.0
info:
  title: RFA 결재 인박스 API (reference)
  summary: Contract for the 결재 인박스 UI PoC; served from synthetic PoC data
  description: 'Derived from the UI PoC (A · 메일형 3단 + 관리자). Each operation''s x-rfa-authority names the
    real owner of the data: rfa_module.review (승희 결재 원본), runtime.sandbox (다영 NemoClaw/OpenShell), core
    (this repository) or reference (PoC fixture only). Nothing here approves, publishes or changes a sandbox.'
  version: 0.1.0
paths:
  /v1/inbox/me:
    get:
      tags:
      - rail
      summary: 현재 결재자와 샌드박스 실행 수 (좌측 하단)
      operationId: getCurrentApprover
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxUser'
      x-rfa-authority: core
  /v1/inbox/inboxes:
    get:
      tags:
      - rail
      summary: 인박스 목록 (채널·담당 에이전트·기밀 등급·대기 건수)
      operationId: listInboxes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InboxSummary'
                type: array
                title: Response Listinboxes
      x-rfa-authority: core
  /v1/inbox/counts:
    get:
      tags:
      - rail
      summary: 결재함/알림함/모든 인박스 배지
      operationId: getCounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCounts'
      x-rfa-authority: core
  /v1/inbox/requests:
    get:
      tags:
      - requests
      summary: 요청 목록 (전체/결재 필요/자동응답 탭, 검색 Ctrl K, 정렬)
      operationId: listRequests
      parameters:
      - name: inbox_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Inbox Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - open
            - needs_approval
            - blocked
            - auto_replied
            - decided
            - declined
            - held
            - in_progress
            - needs_human
            type: string
          - type: 'null'
          title: Status
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Q
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - received_desc
          - received_asc
          type: string
          default: received_desc
          title: Sort
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: rfa_module.review
  /v1/inbox/requests/{request_id}:
    get:
      tags:
      - requests
      summary: '요청 상세: 원본 화면·결재 카드·차단 시도·알림'
      operationId: getRequest
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: rfa_module.review
  /v1/inbox/requests/{request_id}/decision:
    post:
      tags:
      - decisions
      summary: '사람 결정: 범위 선택·응답하지 않기·보류·차단 처리 (+규칙 저장)'
      description: 'Mapping to RFA_module review: the recommended/current-draft option → POST /reviews/{id}/approve;
        another option or decline → POST /reviews/{id}/reject with the chosen scope as reason (rewrite
        loop is 승희 Step 12+). research_direction cards resolve in this core (team run resume). Stale approval_id
        → 409 stale_approval.'
      operationId: submitDecision
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionSubmit'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionReceipt'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Unprocessable Entity
      x-rfa-authority: rfa_module.review
  /v1/inbox/requests/{request_id}/preview:
    get:
      tags:
      - decisions
      summary: 응답 전문 미리보기 (선택한 범위 기준, 전송 아님)
      operationId: previewReply
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      - name: option_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 160
          title: Option Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyPreview'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: core
  /v1/inbox/notifications:
    get:
      tags:
      - notifications
      summary: 알림함
      operationId: listNotifications
      parameters:
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unread Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
                title: Response Listnotifications
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: core
  /v1/inbox/notifications/{notification_id}/read:
    post:
      tags:
      - notifications
      summary: Mark Read
      operationId: markNotificationRead
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: core
  /v1/inbox/activity:
    get:
      tags:
      - activity
      summary: 활동 기록 (샌드박스가 막은 호출 포함)
      operationId: listActivity
      parameters:
      - name: request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Request Id
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Agent Id
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - blocked
            - allowed
            - info
            type: string
          - type: 'null'
          title: Outcome
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityEvent'
                title: Response Listactivity
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: runtime.sandbox
  /v1/inbox/rules:
    get:
      tags:
      - rules
      summary: 결정에서 만든 자동응답 규칙
      operationId: listRules
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Rule'
                type: array
                title: Response Listrules
      x-rfa-authority: core
  /v1/inbox/rules/{rule_id}:
    delete:
      tags:
      - rules
      summary: Delete Rule
      operationId: deleteRule
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '204':
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: core
  /v1/inbox/admin/agents:
    get:
      tags:
      - admin-agents
      summary: 에이전트 목록 (인박스·샌드박스·등급·상태·오늘 호출)
      operationId: listAgents
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminAgent'
                type: array
                title: Response Listagents
      x-rfa-authority: runtime.sandbox
  /v1/inbox/admin/agents/{agent_id}:
    get:
      tags:
      - admin-agents
      summary: '에이전트 상세: 컨텍스트 사용량·불러오는 자료·호출 통계'
      operationId: getAgent
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: runtime.sandbox
  /v1/inbox/admin/agents/{agent_id}/sources/{source_id}:
    put:
      tags:
      - admin-agents
      summary: 불러오는 자료 켜기/끄기 (다른 구획은 409)
      operationId: toggleAgentSource
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSourceToggle'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: core
  /v1/inbox/admin/agents/{agent_id}/compact:
    post:
      tags:
      - admin-agents
      summary: 대화 압축
      operationId: compactAgentConversation
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: runtime.sandbox
  /v1/inbox/admin/agents/{agent_id}/clear-memory:
    post:
      tags:
      - admin-agents
      summary: 기억 비우기
      operationId: clearAgentMemory
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: runtime.sandbox
  /v1/inbox/admin/sandboxes:
    get:
      tags:
      - admin-sandboxes
      summary: 샌드박스 목록 (기밀 등급마다 하나)
      operationId: listSandboxes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Sandbox'
                type: array
                title: Response Listsandboxes
      x-rfa-authority: runtime.sandbox
  /v1/inbox/admin/sandboxes/{sandbox_id}:
    get:
      tags:
      - admin-sandboxes
      summary: '샌드박스 상세: LLM 추론·게이트웨이·네트워크 정책'
      operationId: getSandbox
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          title: Sandbox Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: runtime.sandbox
    patch:
      tags:
      - admin-sandboxes
      summary: 설정 변경 (저장만; '변경 적용' 전까지 pending_changes)
      operationId: updateSandboxSettings
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          title: Sandbox Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxSettingsPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Unprocessable Entity
      x-rfa-authority: runtime.sandbox
  /v1/inbox/admin/sandboxes/{sandbox_id}/apply:
    post:
      tags:
      - admin-sandboxes
      summary: 변경 적용 (컨텍스트 길이·게이트웨이는 다시 만들 때)
      operationId: applySandboxSettings
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          title: Sandbox Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResult'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-rfa-authority: runtime.sandbox
components:
  schemas:
    ActivityEvent:
      properties:
        activity_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Activity Id
        at:
          type: string
          format: date-time
          title: At
        agent_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Agent Id
        sandbox_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Sandbox Id
        action:
          type: string
          title: Action
        outcome:
          type: string
          enum:
          - blocked
          - allowed
          - info
          title: Outcome
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        request_id:
          anyOf:
          - type: string
            maxLength: 160
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          - type: 'null'
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - activity_id
      - at
      - agent_id
      - sandbox_id
      - action
      - outcome
      title: ActivityEvent
      description: '''활동 기록'' rows, including sandbox blocks (POST /reviews/14/approve → 결재는 사람만).'
    AdminAgent:
      properties:
        agent_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Agent Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        inbox_id:
          anyOf:
          - type: string
            maxLength: 160
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          - type: 'null'
          title: Inbox Id
        inbox_name:
          type: string
          title: Inbox Name
        sandbox_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Sandbox Id
        clearance:
          type: string
          enum:
          - public
          - company
          - division
          - team
          title: Clearance
        status:
          type: string
          enum:
          - running
          - waiting_decision
          - stopped
          title: Status
        calls_today:
          type: integer
          minimum: 0.0
          title: Calls Today
      additionalProperties: false
      type: object
      required:
      - agent_id
      - name
      - description
      - inbox_name
      - sandbox_id
      - clearance
      - status
      - calls_today
      title: AdminAgent
    AdminAgentDetail:
      properties:
        agent_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Agent Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        inbox_id:
          anyOf:
          - type: string
            maxLength: 160
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          - type: 'null'
          title: Inbox Id
        inbox_name:
          type: string
          title: Inbox Name
        sandbox_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Sandbox Id
        clearance:
          type: string
          enum:
          - public
          - company
          - division
          - team
          title: Clearance
        status:
          type: string
          enum:
          - running
          - waiting_decision
          - stopped
          title: Status
        calls_today:
          type: integer
          minimum: 0.0
          title: Calls Today
        context:
          $ref: '#/components/schemas/ContextUsage'
        sources:
          items:
            $ref: '#/components/schemas/LoadedSource'
          type: array
          title: Sources
        stats:
          $ref: '#/components/schemas/CallStats'
      additionalProperties: false
      type: object
      required:
      - agent_id
      - name
      - description
      - inbox_name
      - sandbox_id
      - clearance
      - status
      - calls_today
      - context
      - stats
      title: AdminAgentDetail
    AgentSourceToggle:
      properties:
        enabled:
          type: boolean
          title: Enabled
      additionalProperties: false
      type: object
      required:
      - enabled
      title: AgentSourceToggle
    ApplyResult:
      properties:
        sandbox_id:
          type: string
          maxLength: 160
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/#-]*$
          title: Sandbox Id
        applied:
          items:
            type: string
          type: array
          title: Applied
        requires_recreate:
          items:
            type: string
          type: array
          title: Requires Recreate
        upstream:
          $ref: '#/components/schemas/UpstreamRef'
      additionalProperties: false
      type: object
      required:
      - sandbox_id
      - applied
      - requires_recreate
      - upstream
      title: ApplyResult
    BlockedAttempt:
      properties:
        at:
          type: string
          format: date-time
          title: At
        action:
          type: string
          title: Action
        reason:
          type: string
          title: Reason
        kind:
          type: string
